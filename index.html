/* 
  Supabase SDK 改為「需要時才載入」，避免在 Chrome 直接開啟本機 HTML 時，
  外部 CDN 載入失敗或網路延遲造成整個 APP 停在「載入中…」。
*/
function loadSupabaseSdk(){
  if(window.supabase && typeof window.supabase.createClient === 'function') return Promise.resolve(window.supabase);
  if(supabaseLoadPromise) return supabaseLoadPromise;

  const sources = [
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
    'https://unpkg.com/@supabase/supabase-js@2'
  ];

  supabaseLoadPromise = new Promise((resolve, reject)=>{
    let idx = 0;
    const tryLoad = ()=>{
      if(window.supabase && typeof window.supabase.createClient === 'function'){
        resolve(window.supabase);
        return;
      }
      if(idx >= sources.length){
        reject(new Error('Supabase SDK 載入失敗，請確認網路連線或 CDN 是否被擋'));
        return;
      }
      const s = document.createElement('script');
      s.src = sources[idx++];
      s.async = true;
      let done = false;
      const timer = setTimeout(()=>{
        if(done) return;
        done = true;
        try{ s.remove(); }catch(e){}
        tryLoad();
      }, 5000);
      s.onload = ()=>{
        if(done) return;
        done = true;
        clearTimeout(timer);
        if(window.supabase && typeof window.supabase.createClient === 'function') resolve(window.supabase);
        else tryLoad();
      };
      s.onerror = ()=>{
        if(done) return;
        done = true;
        clearTimeout(timer);
        try{ s.remove(); }catch(e){}
        tryLoad();
      };
      document.head.appendChild(s);
    };
    tryLoad();
  });

  return supabaseLoadPromise;
}

async function getSupabaseClient(){
  if(!hasSupabaseConfig()) return null;
  await loadSupabaseSdk();
  if(!window.supabase || typeof window.supabase.createClient !== 'function'){
    throw new Error('Supabase SDK 未載入，請確認網路連線');
  }
  if(!supabaseClient || supabaseClient.__syncUrl !== syncConfig.url || supabaseClient.__syncKey !== syncConfig.anonKey){
    supabaseClient = window.supabase.createClient(syncConfig.url, syncConfig.anonKey);
    // 僅供判斷是否需依新設定重建 client
    try{
      Object.defineProperty(supabaseClient, '__syncUrl', { value: syncConfig.url, configurable:true });
      Object.defineProperty(supabaseClient, '__syncKey', { value: syncConfig.anonKey, configurable:true });
    }catch(e){}
  }
  return supabaseClient;
}

const store = {
  async get(key){
    if(HAS_CLAUDE_CLOUD){
      try{ return await window.storage.get(key); }catch(e){ return null; }
    }
    if(hasSupabaseConfig()){
      try{
        const client = await getSupabaseClient();
        const { data, error } = await client
          .from(syncConfig.table)
          .select('data,updated_at')
          .eq('id', syncConfig.rowId)
          .maybeSingle();
        if(error) throw error;
        return data && data.data ? { key, value: JSON.stringify(data.data) } : null;
      }catch(e){
        console.warn('Supabase 讀取失敗，暫用本機快取', e);
        const cached = localStorage.getItem(key);
        return cached!==null ? {key, value:cached} : null;
      }
    }
    const v = localStorage.getItem(key);
    return v!==null ? {key, value:v} : null;
  },
  async set(key, value){
    if(HAS_CLAUDE_CLOUD){ return await window.storage.set(key, value); }
    if(hasSupabaseConfig()){
      let parsed;
      try{ parsed = JSON.parse(value); }catch(e){ parsed = value; }
      try{
        const client = await getSupabaseClient();
        const { error } = await client
          .from(syncConfig.table)
          .upsert({ id: syncConfig.rowId, data: parsed, updated_at: new Date().toISOString() }, { onConflict:'id' });
        if(error) throw error;
        localStorage.setItem(key, value); // 本機快取，離線時可讀
        return {key, value};
      }catch(e){
        console.warn('Supabase 儲存失敗，先存入本機', e);
        localStorage.setItem(key, value);
        throw e;
      }
    }
    localStorage.setItem(key, value);
    return {key, value};
  }
};


/* ---------- 各棟獨立設定資料層 ---------- */
function clonePlain(v){ return v==null?v:JSON.parse(JSON.stringify(v)); }
function buildingById(proj, buildingId){
  return proj?.buildings?.find(b=>b.id===buildingId) || null;
}
function processById(proj,id){ return (proj?.processes||[]).find(x=>x.id===id) || null; }
function partById(proj,id){ return (proj?.parts||[]).find(x=>x.id===id) || null; }

function buildingProcesses(proj, buildingOrId){
  const b=typeof buildingOrId==='string'?buildingById(proj,buildingOrId):buildingOrId;
  if(!b) return [];
  const ids=new Set(b.processIds||[]);
  return (proj.processes||[]).filter(x=>ids.has(x.id))
    .sort((a,c)=>(b.processIds||[]).indexOf(a.id)-(b.processIds||[]).indexOf(c.id));
}
function buildingParts(proj, buildingOrId){
  const b=typeof buildingOrId==='string'?buildingById(proj,buildingOrId):buildingOrId;
  if(!b) return [];
  const ids=new Set(b.partIds||[]);
  return (proj.parts||[]).filter(x=>ids.has(x.id))
    .sort((a,c)=>(b.partIds||[]).indexOf(a.id)-(b.partIds||[]).indexOf(c.id));
}
function buildingProcessGroups(proj, buildingOrId){
  const b=typeof buildingOrId==='string'?buildingById(proj,buildingOrId):buildingOrId;
  if(!b) return [];
  const ids=new Set(b.processGroupIds||[]);
  return (proj.processGroups||[]).filter(x=>ids.has(x.id))
    .sort((a,c)=>(b.processGroupIds||[]).indexOf(a.id)-(b.processGroupIds||[]).indexOf(c.id));
}
function actualTableFor(proj, buildingId){
  const b=buildingById(proj,buildingId) || currentBuilding();
  if(!b) return null;
  if(!b.actualTable || typeof b.actualTable!=='object'){
    const tpl=proj.actualTableTemplate || proj.actualTable || {partGroups:cloneActualGroups(),sections:cloneActualSections(),cells:{}};
    b.actualTable={
      ...clonePlain(tpl),
      partGroups:clonePlain(tpl.partGroups||cloneActualGroups()),
      sections:clonePlain(tpl.sections||cloneActualSections()),
      cells:{}
    };
  }
  if(!b.actualTable.cells || typeof b.actualTable.cells!=='object') b.actualTable.cells={};
  return b.actualTable;
}
function syncActiveActualTableAlias(proj,b){
  if(proj&&b) proj.actualTable=actualTableFor(proj,b.id);
}

function cloneConfigToBuilding(proj,b,sourceB){
  const sourceProcesses=sourceB?buildingProcesses(proj,sourceB):
    (proj.processTemplateNames||defaultProcessNames()).map(name=>({id:null,name,groupId:null}));
  const sourceParts=sourceB?buildingParts(proj,sourceB):
    (proj.partTemplateNames||defaultPartNames()).map(name=>({id:null,name}));
  const sourceGroups=sourceB?buildingProcessGroups(proj,sourceB):[];

  const groupMap=new Map();
  const newGroups=sourceGroups.map(g=>{
    const ng={id:uid('grp'),name:g.name};
    groupMap.set(g.id,ng.id); return ng;
  });
  const processMap=new Map();
  const newProcesses=sourceProcesses.map(pr=>{
    const np={id:uid('pr'),name:pr.name,groupId:pr.groupId?groupMap.get(pr.groupId)||null:null};
    if(pr.id) processMap.set(pr.id,np.id);
    return np;
  });
  const partMap=new Map();
  const newParts=sourceParts.map(pt=>{
    const np={id:uid('pt'),name:pt.name};
    if(pt.id) partMap.set(pt.id,np.id);
    return np;
  });

  proj.processGroups.push(...newGroups);
  proj.processes.push(...newProcesses);
  proj.parts.push(...newParts);
  b.processGroupIds=newGroups.map(x=>x.id);
  b.processIds=newProcesses.map(x=>x.id);
  b.partIds=newParts.map(x=>x.id);

  ensureGanttSubprocessStore(proj);
  if(sourceB){
    buildingProcesses(proj,sourceB).forEach(oldPr=>{
      const newPid=processMap.get(oldPr.id);
      if(!newPid) return;
      proj.ganttSubprocessesByProcess[newPid]=(proj.ganttSubprocessesByProcess[oldPr.id]||[])
        .map(sp=>({id:uid('gsp'),name:sp.name,visible:sp.visible!==false}));
    });
  }

  const sourceTable=sourceB?actualTableFor(proj,sourceB.id):(proj.actualTableTemplate||proj.actualTable);
  b.actualTable={
    ...(clonePlain(sourceTable)||{}),
    partGroups:clonePlain(sourceTable?.partGroups||cloneActualGroups()),
    sections:clonePlain(sourceTable?.sections||cloneActualSections()),
    cells:{}
  };
  return {processMap,partMap};
}

function migrateProjectToIndependentBuildings(proj){
  if(!Array.isArray(proj.processes)) proj.processes=[];
  if(!Array.isArray(proj.parts)) proj.parts=[];
  if(!Array.isArray(proj.processGroups)) proj.processGroups=[];
  if(!Array.isArray(proj.buildings)) proj.buildings=[];
  ensureGanttSubprocessStore(proj);

  if(proj.buildingConfigVersion>=2){
    proj.buildings.forEach((b,i)=>{
      if(!Array.isArray(b.processIds)||!Array.isArray(b.partIds)||!Array.isArray(b.processGroupIds)){
        const source=proj.buildings.find((x,j)=>j!==i&&Array.isArray(x.processIds));
        cloneConfigToBuilding(proj,b,source||null);
      }
      actualTableFor(proj,b.id);
    });
    return;
  }

  const oldProcesses=(proj.processes||[]).map(x=>({...x}));
  const oldParts=(proj.parts||[]).map(x=>({...x}));
  const oldGroups=(proj.processGroups||[]).map(x=>({...x}));
  const oldSub=clonePlain(proj.ganttSubprocessesByProcess||{});
  const oldActual=clonePlain(proj.actualTable||{partGroups:cloneActualGroups(),sections:cloneActualSections(),cells:{}});

  proj.processTemplateNames=oldProcesses.length?oldProcesses.map(x=>x.name):defaultProcessNames();
  proj.partTemplateNames=oldParts.length?oldParts.map(x=>x.name):defaultPartNames();
  proj.actualTableTemplate={
    ...clonePlain(oldActual),
    partGroups:clonePlain(oldActual.partGroups||cloneActualGroups()),
    sections:clonePlain(oldActual.sections||cloneActualSections()),
    cells:{}
  };

  const newProcesses=[],newParts=[],newGroups=[],newSub={};

  proj.buildings.forEach(b=>{
    const groupMap=new Map();
    const localGroups=oldGroups.map(g=>{
      const ng={id:uid('grp'),name:g.name};
      groupMap.set(g.id,ng.id); return ng;
    });
    const processMap=new Map();
    const localProcesses=(oldProcesses.length?oldProcesses:makeProcesses(defaultProcessNames())).map(pr=>{
      const np={id:uid('pr'),name:pr.name,groupId:pr.groupId?groupMap.get(pr.groupId)||null:null};
      processMap.set(pr.id,np.id); return np;
    });
    const partMap=new Map();
    const localParts=(oldParts.length?oldParts:makeParts(defaultPartNames())).map(pt=>{
      const np={id:uid('pt'),name:pt.name};
      partMap.set(pt.id,np.id); return np;
    });

    b.processGroupIds=localGroups.map(x=>x.id);
    b.processIds=localProcesses.map(x=>x.id);
    b.partIds=localParts.map(x=>x.id);

    const subMap=new Map();
    oldProcesses.forEach(op=>{
      const npid=processMap.get(op.id);
      if(!npid) return;
      const list=(oldSub[op.id]||[]).map(sp=>{
        const nsp={id:uid('gsp'),name:sp.name,visible:sp.visible!==false};
        subMap.set(sp.id,nsp.id); return nsp;
      });
      newSub[npid]=list;
    });

    (proj.records||[]).filter(r=>r.buildingId===b.id).forEach(r=>{
      r.processId=processMap.get(r.processId)||r.processId;
      r.partIds=(r.partIds||[]).map(id=>partMap.get(id)||id).filter(id=>localParts.some(p=>p.id===id));
    });
    (proj.schedules||[]).filter(s=>s.buildingId===b.id).forEach(s=>{
      s.processId=processMap.get(s.processId)||s.processId;
      if(s.subProcessId) s.subProcessId=subMap.get(s.subProcessId)||null;
    });

    const localCells={};
    Object.entries(oldActual.cells||{}).forEach(([k,v])=>{
      if(k.startsWith(String(b.id)+'||')) localCells[k]=clonePlain(v);
    });
    b.actualTable={
      ...clonePlain(oldActual),
      partGroups:clonePlain(oldActual.partGroups||cloneActualGroups()),
      sections:clonePlain(oldActual.sections||cloneActualSections()),
      cells:localCells
    };

    newGroups.push(...localGroups);
    newProcesses.push(...localProcesses);
    newParts.push(...localParts);
  });

  proj.processGroups=newGroups;
  proj.processes=newProcesses;
  proj.parts=newParts;
  proj.ganttSubprocessesByProcess=newSub;
  proj.ganttSubprocesses=[];
  proj.actualTable=proj.buildings[0]?.actualTable || proj.actualTableTemplate;
  proj.buildingConfigVersion=2;
}

function normalizeStateShape(target){
  if(!target || !Array.isArray(target.projects)) return target;
  target.projects.forEach(p=>{
    migrateProjectToIndependentBuildings(p);
    if(!Array.isArray(p.schedules)) p.schedules=[];
    if(!Array.isArray(p.processGroups)) p.processGroups=[];
    if(!Array.isArray(p.contacts)) p.contacts=[];
    if(!Array.isArray(p.vendors)) p.vendors=[];
    if(p.storageArea===undefined) p.storageArea='';
    if(p.entryRules===undefined) p.entryRules='';
    if(p.handoverSummary===undefined) p.handoverSummary='';
    if(!Array.isArray(p.billingItems)) p.billingItems=[];
    if(!Array.isArray(p.billingRecords)) p.billingRecords=[];

    (p.processes||[]).forEach(pr=>{ if(pr.groupId===undefined) pr.groupId=null; });
    ensureGanttSubprocessStore(p);
    (p.records||[]).forEach(r=>{
      if(!r.status) r.status = r.progress>=100?'done':'not_started';
      if(r.status==='waiting_billing') r.status='pending_confirm';
      if(r.crew===undefined) r.crew='';
      if(r.photo===undefined) r.photo=null;
      if(r.blockReason===undefined) r.blockReason='';
      if(r.blockReason==='待請款') r.blockReason='';
    });
    (p.schedules||[]).forEach(s=>{
      if(s.actualStartDate===undefined) s.actualStartDate=null;
      if(s.actualCompleteDate===undefined) s.actualCompleteDate=null;
      if(!Array.isArray(s.dependsOn)) s.dependsOn=[];
      if(s.subProcessId===undefined) s.subProcessId=null;
    });
  });

  if(!Array.isArray(target.quickTemplates)) target.quickTemplates = [];
  if(!target.view) target.view = 'home';
  if(!target.matrixMode) target.matrixMode = 'single';
  if(!target.ganttMode) target.ganttMode = 'single';
  if(!target.ganttRange) target.ganttRange = {start:'', end:''};
  if(!target.activeProjectId || !target.projects.find(p=>p.id===target.activeProjectId)){
    target.activeProjectId = target.projects[0]?.id || null;
  }
  const proj = target.projects.find(p=>p.id===target.activeProjectId);
  if(proj && (!target.activeBuildingId || !proj.buildings.find(b=>b.id===target.activeBuildingId))){
    target.activeBuildingId = proj.buildings[0] ? proj.buildings[0].id : null;
  }
  const validViews = ['home','handover','buildings','matrix','actual','schedule','records','tasks','photos'];
  if(target.view==='billing' || !validViews.includes(target.view)) target.view='home';
  return target;
}

function mergeRemoteKeepingLocalPage(remote){
  const ui = currentUiState(state);
  state = normalizeStateShape(remote);
  applyLocalUiState(state, ui);
  normalizeStateShape(state);
  persistLocalUiState();
  return state;
}

async function loadState(){
  const localUi = readLocalUiState();
  try{
    const res = await store.get(STORAGE_KEY);
    state = (res && res.value) ? JSON.parse(res.value) : null;
  }catch(e){ state = null; }

  if(!state || !Array.isArray(state.projects) || state.projects.length===0){
    state = defaultState();
    try{ await store.set(STORAGE_KEY, JSON.stringify(persistentStatePayload(state))); }catch(e){}
  }

  normalizeStateShape(state);
  applyLocalUiState(state, localUi);
  normalizeStateShape(state);
  persistLocalUiState();
  render();
  startAutoRefresh();
}
function scheduleSave(){
  persistLocalUiState();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await store.set(STORAGE_KEY, JSON.stringify(persistentStatePayload(state)));
      setSyncStatus(true);
    }catch(e){
      setSyncStatus(false);
      showToast('儲存失敗，請檢查網路連線','error');
    }
  }, 350);
}
function setSyncStatus(ok){
  const dot=document.getElementById('sync-indicator');
  if(dot){ dot.style.background = ok?'var(--green)':'var(--red)'; dot.title = syncModeDetail(); }
}
function startAutoRefresh(){
  clearInterval(refreshTimer);
  if(!isCloudEnabled()) return;
  refreshTimer = setInterval(async ()=>{
    if(document.hidden || document.querySelector('.modal-overlay')) return;
    try{
      const res = await store.get(STORAGE_KEY);
      if(res && res.value){
        const remote = JSON.parse(res.value);
        // 只比較工程資料，不比較目前頁面／目前案場等本機 UI 狀態。
        if(persistentFingerprint(remote)!==persistentFingerprint(state)){
          const y = window.scrollY;
          mergeRemoteKeepingLocalPage(remote);
          setSyncStatus(true);
          render();
          requestAnimationFrame(()=>window.scrollTo(0,y));
        }
      }
    }catch(e){ setSyncStatus(false); }
  }, SYNC_POLL_INTERVAL_MS);
}
async function manualRefresh(){
  if(!isCloudEnabled()){ showToast('目前為本機模式（無雲端同步）'); return; }
  try{
    const res = await store.get(STORAGE_KEY);
    if(res && res.value){
      const y = window.scrollY;
      mergeRemoteKeepingLocalPage(JSON.parse(res.value));
      render();
      requestAnimationFrame(()=>window.scrollTo(0,y));
      showToast('資料已更新，目前頁面保持不變');
    }else{
      showToast('雲端尚無資料，可先到同步設定上傳目前資料');
    }
    setSyncStatus(true);
  }catch(e){
    setSyncStatus(false);
    showToast('更新失敗，請檢查同步設定','error');
  }
}

function exportBackup(){
  const payload = JSON.stringify(persistentStatePayload(state), null, 1);
  const blob = new Blob([payload], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const d = new Date(), p = n=>String(n).padStart(2,'0');
  a.download = `工地進度備份_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('已匯出備份檔');
}
function importBackupTrigger(){ document.getElementById('backup-file-input').click(); }
async function importBackupFile(e){
  const file = e.target.files[0]; if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || !Array.isArray(data.projects)) throw new Error('格式不符');
    if(!confirm(`確定匯入備份？將以備份內容（${data.projects.length} 個案場）覆蓋目前所有資料，此操作無法復原。`)){ e.target.value=''; return; }
    state = normalizeStateShape(data);
    applyLocalUiState(state, readLocalUiState());
    await store.set(STORAGE_KEY, JSON.stringify(persistentStatePayload(state)));
    e.target.value='';
    loadState(); // 走一次正規化流程補齊欄位
    showToast('已匯入備份資料');
  }catch(err){ showToast('匯入失敗：檔案格式不正確','error'); e.target.value=''; }
}

/* ---------- 取用輔助 ---------- */
function currentProject(){ return state.projects.find(p=>p.id===state.activeProjectId) || null; }
function currentBuilding(){ const proj=currentProject(); if(!proj) return null; const b=proj.buildings.find(b=>b.id===state.activeBuildingId) || proj.buildings[0] || null; if(b) syncActiveActualTableAlias(proj,b); return b; }
function getRecords(projId, buildingId, floor, processId){
  const proj = state.projects.find(p=>p.id===projId); if(!proj) return [];
  return proj.records.filter(r=>r.buildingId===buildingId && r.floor===floor && r.processId===processId);
}
function cellBucket(records){
  if(records.length===0) return {bucket:'none', avg:0, count:0};
  const avg = Math.round(records.reduce((s,r)=>s+Number(r.progress||0),0)/records.length);
  let bucket = 'progress';
  if(records.some(r=>r.status==='delayed')) bucket='delayed';
  else if(avg>=100) bucket='done';
  return {bucket, avg, count:records.length};
}

// 找出矩陣此工序應納入計算的施工部位。
// 若實際進度表已有柱位設定，優先採用實際進度表中的柱位；否則使用專案施工部位。
function matrixConfiguredPartIds(proj,buildingId){
  const actualNames=new Set(
    (actualTableFor(proj,buildingId)?.partGroups||[])
      .flatMap(g=>g.parts||[])
      .map(normalizePartName)
      .filter(Boolean)
  );
  const actualIds=buildingParts(proj,buildingId)
    .filter(p=>actualNames.has(normalizePartName(p.name)))
    .map(p=>p.id);

  // 有建立實況表柱位時，矩陣優先用實況表的柱位總數。
  if(actualIds.length) return actualIds;

  // 否則使用專案「部位分類」中全部有效部位。
  return buildingParts(proj,buildingId)
    .filter(p=>normalizePartName(p.name))
    .map(p=>p.id);
}

function matrixExpectedPartIds(proj, records, buildingId){
  const usedIds=[...new Set((records||[]).flatMap(r=>r.partIds||[]))];
  if(!usedIds.length) return [];

  const actualNames=new Set(
    (actualTableFor(proj,buildingId)?.partGroups||[])
      .flatMap(g=>g.parts||[])
      .map(normalizePartName)
      .filter(Boolean)
  );
  const actualIds=buildingParts(proj,buildingId)
    .filter(p=>actualNames.has(normalizePartName(p.name)))
    .map(p=>p.id);

  // 若這一格使用實況表柱位，分母採用全部實況表柱位。
  if(actualIds.length && usedIds.some(id=>actualIds.includes(id))) return actualIds;

  return buildingParts(proj,buildingId)
    .filter(p=>normalizePartName(p.name))
    .map(p=>p.id);
}

function matrixAutoSelectionStats(proj, selectedPartIds){
  const expectedIds=matrixConfiguredPartIds(proj,currentBuilding()?.id);
  const expectedSet=new Set(expectedIds);
  const selected=[...new Set((selectedPartIds||[]).filter(id=>expectedSet.has(id)))];
  const total=expectedIds.length;
  const done=selected.length;
  const percent=total ? Math.round(done/total*100) : 0;
  return {expectedIds,selected,total,done,percent};
}

// 矩陣自動進度：每個施工部位取最高完成度，再除以總部位數。
// 例：共 10 柱，5 柱完成 100%，其餘未施作，即自動顯示 50%。
function matrixCellStats(proj, buildingId, floor, processId){
  const records=getRecords(proj.id,buildingId,floor,processId);
  if(!records.length) return {bucket:'none',avg:0,count:0,usesParts:false,doneParts:0,totalParts:0};

  const specific=records.filter(r=>(r.partIds||[]).length>0);
  if(specific.length){
    const expectedIds=matrixExpectedPartIds(proj,specific,buildingId);
    if(expectedIds.length){
      const progressByPart=new Map(expectedIds.map(id=>[id,0]));
      specific.forEach(r=>{
        const value=r.status==='done'?100:clamp(Number(r.progress||0),0,100);
        (r.partIds||[]).forEach(id=>{
          if(progressByPart.has(id)){
            progressByPart.set(id,Math.max(progressByPart.get(id)||0,value));
          }
        });
      });
      const vals=[...progressByPart.values()];
      const avg=Math.round(vals.reduce((s,v)=>s+v,0)/vals.length);
      const doneParts=vals.filter(v=>v>=100).length;
      let bucket='progress';
      if(records.some(r=>r.status==='delayed')) bucket='delayed';
      else if(avg>=100) bucket='done';
      return {
        bucket,avg,count:records.length,usesParts:true,
        doneParts,totalParts:expectedIds.length
      };
    }
  }

  const base=cellBucket(records);
  return {...base,usesParts:false,doneParts:0,totalParts:0};
}
function partNames(proj, ids){ if(!ids||ids.length===0) return '全區域'; return ids.map(id=>{const p=proj.parts.find(x=>x.id===id);return p?p.name:null;}).filter(Boolean).join('、'); }
// 該棟「樓層×工序」整體平均（含未施作項目視為0%）
function buildingProcessAverages(proj, b){
  return buildingProcesses(proj,b).map(pr=>{
    let sum=0;
    b.floors.forEach(fl=>{ sum += matrixCellStats(proj,b.id,fl,pr.id).avg; });
    const avg = b.floors.length ? Math.round(sum/b.floors.length) : 0;
    return {process:pr, avg};
  });
}
function buildingOverallAvg(proj,b){
  const avgs = buildingProcessAverages(proj,b);
  return avgs.length ? Math.round(avgs.reduce((s,x)=>s+x.avg,0)/avgs.length) : 0;
}
function projectOverallAvg(proj){
  if(proj.buildings.length===0) return 0;
  const vals = proj.buildings.map(b=>buildingOverallAvg(proj,b));
  return Math.round(vals.reduce((a,c)=>a+c,0)/vals.length);
}
// 專案內所有「延誤」來源：狀態=delayed 的記錄 ＋ 已逾預定完成日卻未填實際完成日的排程
function projectDelayItems(proj){
  const items = [];

  const delayedGroups=groupTaskRecordsByFloor(
    proj,
    proj.records.filter(r=>r.status==='delayed')
  );
  delayedGroups.forEach(g=>{
    items.push({
      type:'record',proj,b:g.b,pr:g.pr,floor:g.floor,
      note:g.issue,updatedAt:g.latestUpdate,
      recordId:g.recordId,recordIds:g.recordIds
    });
  });

  const today = todayStr();
  proj.schedules.filter(s=>!s.actualCompleteDate && s.endDate < today).forEach(s=>{
    const b = proj.buildings.find(x=>x.id===s.buildingId);
    const pr = proj.processes.find(x=>x.id===s.processId);
    if(!b||!pr) return;
    items.push({
      type:'schedule',proj,b,pr,
      floor:taskFloorLabel(b,s.floors),
      note:s.note,updatedAt:fromDateStr(s.endDate).getTime(),
      scheduleId:s.id,endDate:s.endDate
    });
  });
  return items;
}
// 今日待辦：排程日期涵蓋今天、尚未標記實際完成
function projectTodayTasks(proj){
  const today = todayStr();
  return proj.schedules.filter(s=>!s.actualCompleteDate && s.startDate<=today && s.endDate>=today).map(s=>{
    const b = proj.buildings.find(x=>x.id===s.buildingId); const pr = proj.processes.find(x=>x.id===s.processId);
    return b&&pr ? {proj,b,pr,floor:taskFloorLabel(b,s.floors),scheduleId:s.id,endDate:s.endDate} : null;
  }).filter(Boolean);
}

function showToast(msg, type){
  const root = document.getElementById('toast-root');

}

/* 安全導覽：
   - 拖曳／滑動後 450ms 內不切頁
   - 已在同一頁時不重複重繪
   - 切換案場只換資料，不強制跳到別頁 */
let navBlockedUntil = 0;
let navPointerStart = null;
document.addEventListener('pointerdown', e=>{
  navPointerStart = {x:e.clientX, y:e.clientY};
}, true);
document.addEventListener('pointermove', e=>{
  if(!navPointerStart) return;
  if(Math.hypot(e.clientX-navPointerStart.x, e.clientY-navPointerStart.y) > 9){
    navBlockedUntil = Date.now()+450;
  }
}, true);
document.addEventListener('pointerup', ()=>{ navPointerStart=null; }, true);

let navSwitchLock = false;
function setView(v){
  if(Date.now() < navBlockedUntil || navSwitchLock) return;
  const validViews = ['home','handover','buildings','matrix','actual','schedule','records','tasks','photos'];
  if(!validViews.includes(v)) return;

  if(state.view===v){
    if(formState.sidebarOpen){
      formState.sidebarOpen=false;
      render();
    }
    return;
  }

  navSwitchLock = true;
  state.view = v;
  formState.sidebarOpen = false;
  persistLocalUiState();
  render();
  setTimeout(()=>{ navSwitchLock=false; }, 260);
}
function selectProject(id){
  state.activeProjectId=id;
  const p=currentProject();
  state.activeBuildingId=p?.buildings[0]?.id || null;
  formState.sidebarOpen=false;
  persistLocalUiState();
  render();
}
function selectBuilding(id){
  state.activeBuildingId=id;
  persistLocalUiState();
  render();
}
function switchProjectKeepView(id){
  state.activeProjectId=id;
  const p=currentProject();
  if(!p) return;
  if(!p.buildings.some(b=>b.id===state.activeBuildingId)){
    state.activeBuildingId=p.buildings[0]?.id || null;
  }
  formState.sidebarOpen=false;
  persistLocalUiState();
  render();
}
function goToSite(projId){ selectProject(projId); }

function editRecordFromHome(projId, recordId){
  state.activeProjectId = projId;
  const proj = currentProject();
  const r = proj.records.find(x=>x.id===recordId); if(!r){ showToast('找不到此筆記錄','error'); return; }
  state.activeBuildingId = r.buildingId;
  formState.cell = {buildingId:r.buildingId, floor:r.floor, processId:r.processId};
  openRecordForm(r.buildingId, r.floor, r.processId, r.id);
}
function reportFromSchedule(projId, scheduleId){
  state.activeProjectId = projId;
  const proj = currentProject();
  const s = proj.schedules.find(x=>x.id===scheduleId); if(!s){ showToast('找不到此筆排程','error'); return; }
  state.activeBuildingId = s.buildingId;
  formState.quickAdd = { projectId:projId, buildingId:s.buildingId, floors:[...s.floors], partIds:[],

}
function renderTodayReport(){
  const projects = state.projects;
  const today = todayStr();
  const yesterday = toDateStr(addDays(new Date(), -1));
  // 今日預定施作
  const todayItems = [];
  projects.forEach(p=> projectTodayTasks(p).forEach(t=>todayItems.push(t)) );
  // 昨日未完成：昨天有更新但進度未達100%且未標完成的記錄
  const yestItems = [];
  projects.forEach(p=> p.records.forEach(r=>{
    if(toDateStr(new Date(r.updatedAt))===yesterday && r.progress<100 && r.status!=='done'){
      const b=p.buildings.find(x=>x.id===r.buildingId), pr=p.processes.find(x=>x.id===r.processId);
      if(b&&pr) yestItems.push({p,r,b,pr});
    }
  }));
  // 延誤項目
  const delayItems = [];
  projects.forEach(p=> projectDelayItems(p).forEach(d=>delayItems.push(d)) );

  const todayHtml = todayItems.length ? todayItems.map(t=>`
    <div class="task-row">
      <div class="t-main">
        <div class="t-title">${esc(t.proj.name)}　${esc(t.b.name)}　${esc(t.floor)}・${esc(t.pr.name)}</div>
        <div class="t-sub">預定完成：${esc(t.endDate)}</div>
      </div>
      <button class="btn btn-sm btn-primary" onclick="reportFromSchedule('${t.proj.id}','${t.scheduleId}')">回報進度</button>
    </div>`).join('') : '<div class="empty-mini">今天沒有排定中的工項</div>';

  const yestHtml = yestItems.length ? yestItems.map(({p,r,b,pr})=>{
    const si = statusInfo(r.status);
    return `<div class="task-row">
      <div class="t-main">
        <div class="t-title">${esc(p.name)}　${esc(b.name)}　${esc(r.floor)}・${esc(pr.name)}</div>
        <div class="t-sub"><span class="badge" style="background:${si.bg};color:${si.fg};padding:1px 7px;">${si.label} ${r.progress}%</span>${r.blockReason?'　⚠ '+esc(r.blockReason):''}${r.note?'　'+esc(r.note):''}</div>
      </div>
      <button class="btn btn-sm" onclick="editRecordFromHome('${p.id}','${r.id}')">更新</button>
    </div>`;
  }).join('') : '<div class="empty-mini">昨日更新的項目都已完成</div>';

  const delayHtml = delayItems.length ? delayItems.map(d=>`
    <div class="task-row">
      <div class="t-main">
        <div class="t-title">${esc(d.proj.name)}　${esc(d.b.name)}　${esc(d.floor)}・${esc(d.pr.name)}</div>
        <div class="t-sub">${d.type==='schedule' ? '預定完成日已過：'+esc(d.endDate) : (d.note?esc(d.note):'已標記延誤')}</div>
      </div>

        ? `<button class="btn btn-sm" onclick="editRecordFromHome('${d.proj.id}','${d.recordId}')">更新</button>`
        : `<button class="btn btn-sm btn-primary" onclick="reportFromSchedule('${d.proj.id}','${d.scheduleId}')">回報進度</button>`}
    </div>`).join('') : '<div class="empty-mini">目前沒有延誤項目</div>';

  return `
  <div class="home-card report-panel">
    <h4>今日回報模式 <span class="hint" style="font-weight:400;">（${today}）點各筆按鈕可直接更新進度、狀態、備註與照片</span></h4>

    <div class="report-group"><h5>② 昨日未完成項目 <span class="cnt-pill">${yestItems.length}</span></h5>${yestHtml}</div>

  </div>`;

function dashboardPhaseAverage(proj,b,terms){
  const list=buildingProcessAverages(proj,b).filter(x=>terms.some(t=>String(x.process.name||'').includes(t)));
  return list.length?Math.round(list.reduce((s,x)=>s+x.avg,0)/list.length):0;
}

function renderHome(){
  if(isTemplateSetupState()) return renderTemplateSetupHome();
  const projects=state.projects;
  const allToday=[],allDelays=[],allFollow=[],recent=[];
  projects.forEach(p=>{
    projectTodayTasks(p).forEach(x=>allToday.push(x));
    projectDelayItems(p).forEach(x=>allDelays.push(x));
    const followGroups=groupHandoverRecords(
      p,
      p.records.filter(r=>r.status!=='done'&&(FOLLOW_STATUSES.includes(r.status)||r.blockReason))
    );
    followGroups.forEach(g=>allFollow.push({p,g}));
    p.records.forEach(r=>recent.push({p,r}));
  });
  allToday.sort((a,b)=>a.endDate.localeCompare(b.endDate));
  allDelays.sort((a,b)=>b.updatedAt-a.updatedAt);
  recent.sort((a,b)=>b.r.updatedAt-a.r.updatedAt);
  const overall=projects.length?Math.round(projects.reduce((s,p)=>s+projectOverallAvg(p),0)/projects.length):0;
  const todayUpdated=recent.filter(x=>toDateStr(new Date(x.r.updatedAt))===todayStr()).length;
  const priority=[];
  allDelays.slice(0,4).forEach(d=>priority.push({kind:'delay',title:`${d.proj.name}｜${d.b.name}｜${d.floor}・${d.pr.name}`,meta:d.type==='schedule'?`預定完成 ${d.endDate}，尚未完成`:(d.note||'已標記延誤'),tag:'延誤',cls:'red',action:d.type==='record'?`editRecordFromHome('${d.proj.id}','${d.recordId}')`:`reportFromSchedule('${d.proj.id}','${d.scheduleId}')`}));
  allToday.filter(t=>!priority.some(x=>x.title.includes(t.proj.name)&&x.title.includes(t.pr.name))).slice(0,4).forEach(t=>priority.push({kind:'today',title:`${t.proj.name}｜${t.b.name}｜${t.floor}・${t.pr.name}`,meta:`今日施工，預定完成 ${t.endDate}`,tag:'今日',cls:'amber',action:`reportFromSchedule('${t.proj.id}','${t.scheduleId}')`}));
  allFollow.slice(0,4).forEach(({p,g})=>{
    if(priority.length>=8)return;
    priority.push({
      kind:'follow',
      title:`${p.name}｜${g.b.name}｜${g.pr.name} ${g.floor}`,
      meta:g.issue||statusInfo(g.status).label,
      tag:'待追',
      cls:'purple',
      action:`editRecordFromHome('${p.id}','${g.recordId}')`

  const blockMap={};
  allFollow.forEach(({g})=>{
    const k=g.issue||statusInfo(g.status).label||'其他';

  return `
    <div class="dashboard-head"><div><h1>今天先處理什麼</h1><p>把會影響工期、材料、工班與現場協調的事情集中在第一屏。</p></div><div class="dashboard-actions"><button class="btn ${formState.reportMode?'btn-navy-active':''}" onclick="toggleReportMode()">${ICO.list} 今日回報模式</button><button class="btn" onclick="setView('tasks')">${ICO.clipboard} 查看全部代辦</button></div></div>

    ${formState.reportMode?renderTodayReport():''}
    <div class="control-grid">
      <div class="control-card"><div class="control-card-head"><h3>今日控制清單</h3><small>延誤優先，其次為今日排程與待確認</small></div><div class="control-card-body">${priority.length?priority.map((x,i)=>`<div class="priority-row"><div class="priority-rank">${i+1}</div><div><div class="priority-title">${esc(x.title)}</div><div class="priority-meta">${esc(x.meta)}</div></div><button class="mini-tag ${x.cls}" onclick="${x.action}">${x.tag}</button></div>`).join(''):'<div class="empty-mini">目前沒有急迫事項</div>'}</div></div>
      <div class="control-card"><div class="control-card-head"><h3>現場風險雷達</h3><small>依卡點原因與等待狀態彙整</small></div><div class="control-card-body">${risks.length?risks.map(([k,v])=>`<div class="risk-row"><div class="risk-top"><span>${esc(k)}</span><span>${v} 件</span></div><div class="risk-bar"><span style="width:${Math.round(v/riskMax*100)}%"></span></div></div>`).join(''):'<div class="empty-mini">目前沒有卡點資料</div>'}</div></div>

function renderTaskCenter(proj){
  const today=projectTodayTasks(proj);
  const overdue=projectDelayItems(proj);

  const waitingGroups=groupTaskRecordsByFloor(
    proj,
    proj.records
      .filter(r=>r.status!=='done'&&(FOLLOW_STATUSES.includes(r.status)||r.blockReason))
      .sort((a,b)=>b.updatedAt-a.updatedAt)
  );

  const doneGroups=groupTaskRecordsByFloor(
    proj,
    proj.records
      .filter(r=>r.status==='done')
      .sort((a,b)=>b.updatedAt-a.updatedAt)
  ).slice(0,12);

  const schedCard=t=>`<div class="task-center-item" onclick="reportFromSchedule('${proj.id}','${t.scheduleId}')">
    <b>${esc(t.b.name)}｜<span class="task-floor-range">${esc(t.floor)}</span>・${esc(t.pr.name)}</b>
    <p>預定完成：${esc(t.endDate)}</p>
    <div class="task-center-meta"><span>${esc(proj.name)}</span><span>回報進度</span></div>
  </div>`;

  const delayCard=d=>`<div class="task-center-item" onclick="${d.type==='record'?`editRecordFromHome('${proj.id}','${d.recordId}')`:`reportFromSchedule('${proj.id}','${d.scheduleId}')`}">
    <b>${esc(d.b.name)}｜<span class="task-floor-range">${esc(d.floor)}</span> ${esc(d.note||d.pr.name)}</b>
    <p>${d.type==='record'?esc(d.pr.name):esc(d.note||('已逾期：'+(d.endDate||'')))}</p>
    <div class="task-center-meta"><span>延誤</span><span>${d.endDate||fmtTime(d.updatedAt)}</span></div>

    const procAvgs = buildingProcessAverages(proj,b).filter(x=>x.avg>0 && x.avg<100);
    // 找目前「主要進行中」的工序：取平均值最高但未達100%者
    let current = null;
    if(procAvgs.length){ current = [...procAvgs].sort((a,c)=>c.avg-a.avg)[0]; }
    const delayCount = proj.records.filter(r=>r.buildingId===b.id && r.status==='delayed').length

        <div class="lbl">目前主要工序</div>
        <div class="val">${current ? esc(current.process.name)+'　'+current.avg+'%' : '無施作中工序'}</div>

const ACTUAL_DEFAULT_PART_GROUPS = [
  {name:'背中庭向', parts:['B4角柱','B3柱','B2柱','B1柱','A1柱','A2柱','A3柱','A4角柱','A1側柱','A2側柱','A3側柱','A4側柱']},
  {name:'中庭向', parts:['B5角柱','B6柱','B7柱','B8柱','A8柱','A7柱','A6柱','A5角柱']},
  {name:'18F以上', parts:['B1側柱','B2側柱','B3側柱','B4側柱']},
];
const ACTUAL_DEFAULT_SECTIONS = [
  {key:'frame', label:'骨架安裝'},
  {key:'panel', label:'包板安裝'},
];
const ACTUAL_STATUS = {
  blank: {label:'空白', cls:'actual-blank', color:'#FFFFFF', text:''},
  slash: {label:'斜線', cls:'actual-slash', color:'#FFFFFF', text:''},
  layout_done: {label:'吊線完成', cls:'actual-layout-done', color:'#C9CED6', text:'吊線'},
  frame_material: {label:'骨架到料', cls:'actual-frame-material', color:'#D8ECFF', text:'骨料'},
  frame_install: {label:'骨架安裝', cls:'actual-frame-install', color:'#87BFF1', text:'安裝'},
  frame_done: {label:'骨架完成', cls:'actual-frame-done', color:'#2F7FC1', text:'完成'},
  frame_survey: {label:'骨架收測', cls:'actual-frame-survey', color:'#0F3F75', text:'收測'},
  panel_cutting: {label:'包板下料', cls:'actual-panel-cutting', color:'#FFE3B8', text:'下料'},
  panel_install: {label:'包板安裝中', cls:'actual-panel-install', color:'#F5B15C', text:'安裝'},
  panel_done: {label:'包板施作完成', cls:'actual-panel-done', color:'#C85B16', text:'完成'},
  silicone: {label:'矽膠施打', cls:'actual-silicone', color:'#42B883', text:'矽膠'},
  repair: {label:'修復／更換', cls:'actual-repair', color:'#8B5CF6', text:'修復'},
  clean: {label:'清潔', cls:'actual-clean', color:'#2F855A', text:'清潔'},
  delayed: {label:'延誤', cls:'actual-delayed', color:'#C4392F', text:'延誤'},
};
const ACTUAL_STATUS_ORDER = ['blank','slash','layout_done','frame_material','frame_install','frame_done','frame_survey','panel_cutting','panel_install','panel_done','silicone','repair','clean','delayed'];
const ACTUAL_PROCESS_BY_STATUS = {
  layout_done:'吊線完成', frame_material:'骨架到料', frame_install:'骨架安裝', frame_done:'骨架完成', frame_survey:'骨架收測',
  panel_cutting:'包板下料', panel_install:'包板安裝中', panel_done:'包板施作完成', silicone:'矽膠施打', repair:'修復／更換', clean:'清潔', delayed:'延誤'
};
let actualDrag = null;
let suppressActualClick = false;

function normalizePartName(name){ return String(name||'').replace(/\s+/g,'').replace(/[()（）]/g,''); }
function cloneActualGroups(){ return ACTUAL_DEFAULT_PART_GROUPS.map(g=>({name:g.name, parts:[...g.parts]})); }
function cloneActualSections(){ return ACTUAL_DEFAULT_SECTIONS.map(s=>({...s})); }
function ensureActualProgressSetup(proj,buildingId){
  const b=buildingById(proj,buildingId)||currentBuilding();
  if(!b)return;
  const table=actualTableFor(proj,b.id);
  proj.actualTable=table;
  let changed=false;
  if(!Array.isArray(table.partGroups)||!table.partGroups.length){table.partGroups=cloneActualGroups();changed=true;}
  if(!Array.isArray(table.sections)||!table.sections.length){table.sections=cloneActualSections();changed=true;}
  if(!table.cells||typeof table.cells!=='object'){table.cells={};changed=true;}
  const localParts=buildingParts(proj,b);
  table.partGroups.flatMap(g=>g.parts||[]).forEach(name=>{
    if(name&&!localParts.some(p=>normalizePartName(p.name)===normalizePartName(name))){
      const pt={id:uid('pt'),name};proj.parts.push(pt);b.partIds.push(pt.id);localParts.push(pt);changed=true;
    }
  });
  const localProcesses=buildingProcesses(proj,b);
  Object.values(ACTUAL_PROCESS_BY_STATUS).forEach(name=>{
    if(name&&!localProcesses.some(p=>p.name===name)){
      const pr={id:uid('pr'),name,groupId:null};proj.processes.push(pr);b.processIds.push(pr.id);localProcesses.push(pr);
      ensureGanttSubprocessStore(proj)[pr.id]=[];changed=true;
    }
  });
  if(changed) scheduleSave();
}
function actualPartId(proj,partName,buildingId){
  const b=buildingById(proj,buildingId)||currentBuilding();
  return buildingParts(proj,b).find(x=>normalizePartName(x.name)===normalizePartName(partName))?.id||null;
}
function actualKey(buildingId,sectionKey,floor,partName){return [buildingId,sectionKey,floor,partName].map(x=>String(x??'')).join('||');}
function actualProcessIdForStatus(proj,statusKey,buildingId){
  const b=buildingById(proj,buildingId)||currentBuilding();
  const name=ACTUAL_PROCESS_BY_STATUS[statusKey]||ACTUAL_STATUS[statusKey]?.label||'實際進度';
  let pr=buildingProcesses(proj,b).find(x=>x.name===name);
  if(!pr){pr={id:uid('pr'),name,groupId:null};proj.processes.push(pr);b.processIds.push(pr.id);ensureGanttSubprocessStore(proj)[pr.id]=[];}
  return pr.id;
}
function actualAllowedStatusKeysForSection(proj, sectionKey, buildingId){
  // 實況表分成「骨架安裝」與「包板安裝」等左側分段。
  // 從 records 推算顏色時，必須依分段限制可顯示的工序，避免拖曳骨架時包板段也跟著顯示。
  const sec = (actualTableFor(proj,buildingId)?.sections||[]).find(s=>s.key===sectionKey) || {};
  const label = String((sec.label || sectionKey || '')).toLowerCase();
  if(label.includes('骨') || label.includes('frame')){
    return ['layout_done','frame_material','frame_install','frame_done','frame_survey'];
  }
  if(label.includes('包') || label.includes('板') || label.includes('panel')){
    return ['panel_cutting','panel_install','panel_done','silicone','repair','clean'];
  }
  return ACTUAL_STATUS_ORDER.filter(k=>!['blank','slash','delayed'].includes(k));
}
function actualStatusFromRecord(proj, buildingId, floor, partName, sectionKey){
  const pid = actualPartId(proj, partName, buildingId);
  const processNameById = new Map(buildingProcesses(proj,buildingId).map(p=>[p.id,p.name]));
  const allowedStatusKeys = actualAllowedStatusKeysForSection(proj, sectionKey, buildingId);
  const targetNames = allowedStatusKeys.map(st=>ACTUAL_PROCESS_BY_STATUS[st]).filter(Boolean);
  const recs = proj.records.filter(r=> r.buildingId===buildingId && r.floor===floor && targetNames.includes(processNameById.get(r.processId)) && (!r.partIds || r.partIds.length===0 || (pid && r.partIds.includes(pid))) );
  // 依工序前後優先顯示後段成果；只在同一左側分段內推算，不跨骨架／包板分段。
  const priority = ['clean','repair','silicone','panel_done','panel_install','panel_cutting','frame_survey','frame_done','frame_install','frame_material','layout_done'].filter(st=>allowedStatusKeys.includes(st));
  for(const st of priority){
    const name = ACTUAL_PROCESS_BY_STATUS[st];
    const hit = recs.find(r=>processNameById.get(r.processId)===name && (r.status==='done' || r.status==='in_progress' || Number(r.progress)>0));

function actualCellsBetween(start, end){
  if(!start || !end || start.buildingId!==end.buildingId || start.sectionKey!==end.sectionKey) return [];
  const proj=currentProject(); const b=currentBuilding(); if(!proj||!b) return [];
  const floors=actualFloorsForSection(proj,b,start.sectionKey); const parts=actualParts(proj,b.id);
  const fi1=floors.indexOf(start.floor), fi2=floors.indexOf(end.floor);
  const pi1=start.partIndex, pi2=end.partIndex;
  if(fi1<0 || fi2<0 || pi1<0 || pi2<0) return [];

  // 安全矩形拖曳：只允許同一個左側分段內形成矩形範圍。
  // 例如從「骨架安裝」拖曳，只會套用骨架安裝段的矩形；不會跨到「包板安裝」段。
  const fMin=Math.min(fi1,fi2), fMax=Math.max(fi1,fi2);
  const pMin=Math.min(pi1,pi2), pMax=Math.max(pi1,pi2);
  const out=[];
  for(let fi=fMin; fi<=fMax; fi++){
    for(let pi=pMin; pi<=pMax; pi++){
      out.push({buildingId:start.buildingId, sectionKey:start.sectionKey, floor:floors[fi], part:parts[pi], partIndex:pi});
    }
  }
  return out;
}

    const partId = actualPartId(proj, part, buildingId);
    const existing = proj.records.find(r=>r.buildingId===buildingId && r.floor===floor && r.processId===prId && partId && (r.partIds||[]).includes(partId));
    const recStatus = data.status==='delayed' ? 'delayed' : (['layout_done','frame_material','frame_done','frame_survey','panel_cutting','panel_done','silicone','repair','clean'].includes(data.status) ? 'done' : 'in_progress');

    else proj.records.push({id:uid('r'), buildingId, floor, processId:prId, partIds:partId?[partId]:[], progress, status:recStatus, note:data.note||'', crew:'', photo:null, blockReason:data.status==='delayed'?'其他':'', updatedAt:Date.now()});
  }
}

function removeActualRecordForCell(proj, cell){
  const allowedNames=new Set(
    actualAllowedStatusKeysForSection(proj,cell.sectionKey,cell.buildingId)
      .map(k=>ACTUAL_PROCESS_BY_STATUS[k]).filter(Boolean)
  );
  const partId=actualPartId(proj,cell.part,cell.buildingId);
  const processNameById=new Map(buildingProcesses(proj,cell.buildingId).map(p=>[p.id,p.name]));

  const next=[];
  proj.records.forEach(r=>{
    const sameBase=
      r.buildingId===cell.buildingId &&
      r.floor===cell.floor &&
      allowedNames.has(processNameById.get(r.processId));
    if(!sameBase){ next.push(r);return; }

    const ids=[...(r.partIds||[])];
    // 無指定部位代表整區，重置此格時移除該整區紀錄，避免狀態重新推算回來。
    if(!ids.length){ return; }
    if(!partId || !ids.includes(partId)){ next.push(r);return; }

    const remain=ids.filter(id=>id!==partId);
    if(remain.length){
      r.partIds=remain;
      r.updatedAt=Date.now();
      next.push(r);
    }
  });
  proj.records=next;
}

/* ---------- 全棟模式：棟別摘要、自動提示、篩選、渲染 ---------- */
function buildingSummary(proj, b){
  const avgs = buildingProcessAverages(proj, b);
  const overall = avgs.length ? Math.round(avgs.reduce((s,x)=>s+x.avg,0)/avgs.length) : 0;
  const recs = proj.records.filter(r=>r.buildingId===b.id);
  const delayedCount = recs.filter(r=>r.status==='delayed').length
    + proj.schedules.filter(s=>s.buildingId===b.id && !s.actualCompleteDate && fromDateStr(s.endDate)<fromDateStr(todayStr())).length;
  const waitingCount = recs.filter(r=>r.status==='waiting_material').length;
  const lastUpdate = recs.length ? Math.max(...recs.map(r=>r.updatedAt)) : null;
  // 目前主要工序：進行中(0<avg<100)工序裡順序最後面的（進度最前緣）；否則判斷全完成/未開始
  const inProg = avgs.filter(x=>x.avg>0 && x.avg<100);
  let mainProcess;
  if(inProg.length) mainProcess = inProg[inProg.length-1].process.name + '（'+inProg[inProg.length-1].avg+'%）';
  else if(avgs.length && avgs.every(x=>x.avg>=100)) mainProcess = '全部完成';
  else {
    let lastDoneIdx=-1; avgs.forEach((x,i)=>{ if(x.avg>=100) lastDoneIdx=i; });
    mainProcess = lastDoneIdx>=0 ? avgs[lastDoneIdx].process.name+' 已完成' : '尚未開始';
  }
  return { overall, mainProcess, delayedCount, waitingCount, lastUpdate, avgs };
}
function shortFloorLabel(b, floors){
  const label = compressFloorLabel(b, floors);
  const firstSeg = label.split('、')[0];
  return label.length>16 ? firstSeg+' 等' : label;
}
// 自動產生「落後提醒」與「接續施工提示」
function buildingSuggestions(proj, b){
  const out = [];
  const { avgs } = buildingSummary(proj, b);
  // 待料追蹤
  const waitingRecs = proj.records.filter(r=>r.buildingId===b.id && r.status==='waiting_material');
  if(waitingRecs.length){
    const prNames = [...new Set(waitingRecs.map(r=>{const p=proj.processes.find(x=>x.id===r.processId);return p?p.name:null;}).filter(Boolean))];
    out.push({type:'warn', text:`${b.name} 目前待${prNames.join('、')}，需追蹤材料預定到場日。`});
  }
  // 延誤警示
  const delayedRecs = proj.records.filter(r=>r.buildingId===b.id && r.status==='delayed');
  const overdue = proj.schedules.filter(s=>s.buildingId===b.id && !s.actualCompleteDate && fromDateStr(s.endDate)<fromDateStr(todayStr()));
  if(delayedRecs.length + overdue.length){
    const detail = overdue.slice(0,2).map(s=>{const p=proj.processes.find(x=>x.id===s.processId);return (p?p.name:'')+' '+shortFloorLabel(b,s.floors)+'（原定'+s.endDate+'完成）';}).join('；');
    out.push({type:'alert', text:`${b.name} 有 ${delayedRecs.length+overdue.length} 項延誤／逾期${detail?'：'+detail:''}，請優先處理。`});
  }
  // 接續施工提示：以進度最前緣的進行中工序為主
  const inProg = avgs.filter(x=>x.avg>0 && x.avg<100);
  if(inProg.length){
    const front = inProg[inProg.length-1];
    const remainFloors = b.floors.filter(fl=>matrixCellStats(proj,b.id,fl,front.process.id).avg<100);
    out.push({type:'next', text:`${b.name} ${front.process.name} 進度最前（${front.avg}%），可接續往 ${shortFloorLabel(b,remainFloors)} 安排施作。`});
  } else {
    let lastDoneIdx=-1; avgs.forEach((x,i)=>{ if(x.avg>=100) lastDoneIdx=i; });
    if(lastDoneIdx>=0 && lastDoneIdx<avgs.length-1){
      out.push({type:'next', text:`${b.name} 已完成${avgs[lastDoneIdx].process.name}，下一步應進入${avgs[lastDoneIdx+1].process.name}。`});
    } else if(avgs.length && lastDoneIdx===avgs.length-1){
      out.push({type:'ok', text:`${b.name} 所有工序均已完成。`});
    }
  }
  return out;
}

  if(!formState.allFilter) formState.allFilter = { building:'', process:'', status:'', floorFrom:'', floorTo:'', kw:'' };
  return formState.allFilter;

function toggleCompareFilter(buildingId){

  f.building = (f.building===buildingId) ? '' : buildingId;

// 依篩選條件計算某棟要顯示的樓層與工序
function applyAllFilter(proj, b){
  const f = getAllFilter();
  let processes = buildingProcesses(proj,b);
  if(f.process) processes = processes.filter(pr=>pr.name===f.process);
  let floors = [...b.floors];
  // 樓層範圍（依該棟樓層順序取區間，輸入單邊也可）
  if(f.floorFrom || f.floorTo){
    const i1 = f.floorFrom ? b.floors.indexOf(f.floorFrom.trim().toUpperCase()) : -1;
    const i2 = f.floorTo ? b.floors.indexOf(f.floorTo.trim().toUpperCase()) : -1;
    if(i1>=0 && i2>=0){ const lo=Math.min(i1,i2), hi=Math.max(i1,i2); floors = b.floors.slice(lo,hi+1); }
    else if(i1>=0) floors = [b.floors[i1]];
    else if(i2>=0) floors = [b.floors[i2]];
    // 若該棟找不到指定樓層，維持全部（避免誤把整棟隱藏）
  }
  const tokens = f.kw.trim().toLowerCase().split(/\s+/).filter(Boolean);
  // 狀態／關鍵字：保留至少有一格符合的樓層
  if(f.status || tokens.length){
    floors = floors.filter(fl=>{
      return processes.some(pr=>{
        const recs = getRecords(proj.id, b.id, fl, pr.id);
        const statusOk = !f.status || recs.some(r=>r.status===f.status);
        if(!statusOk) return false;
        if(!tokens.length) return true;
        const hay = [b.name, fl, pr.name, ...recs.map(r=>(r.note||'')+' '+(r.crew||''))].join(' ').toLowerCase();
        return tokens.every(t=>hay.includes(t));
      });
    });
  }
  return { processes, floors };
}

/* 矩陣互動：點一下＝開啟該樓層/工序的施作記錄編輯視窗；
   拖曳＝只套用反白矩形範圍。套用時會複製起始格的施作記錄並覆蓋選取格原紀錄，避免未選取格子被誤動。 */
let matrixDragState = {active:false, start:null, current:null, moved:false, suppressClick:false};
function matrixCellInfo(td){ return {td, buildingId:td.dataset.b, floor:td.dataset.fl, processId:td.dataset.pr, table:td.closest('table.matrix')}; }
function clearMatrixSelection(){ document.querySelectorAll('td.mx-cell.mx-selected,td.mx-cell.mx-reset-selected').forEach(td=>{td.classList.remove('mx-selected');td.classList.remove('mx-reset-selected');}); }
function matrixCellsBetween(startInfo, endInfo){
  if(!startInfo || !endInfo || startInfo.table!==endInfo.table || startInfo.buildingId!==endInfo.buildingId) return [];
  const r1 = startInfo.td.parentElement.rowIndex, r2 = endInfo.td.parentElement.rowIndex;
  const c1 = startInfo.td.cellIndex, c2 = endInfo.td.cellIndex;
  const rMin=Math.min(r1,r2), rMax=Math.max(r1,r2), cMin=Math.min(c1,c2), cMax=Math.max(c1,c2);
  const rows=[...startInfo.table.rows];
  const cells=[];
  for(let r=rMin; r<=rMax; r++){
    const row=rows[r]; if(!row) continue;
    for(let c=cMin; c<=cMax; c++){
      const td=row.cells[c];
      if(td && td.classList.contains('mx-cell') && td.dataset.b===startInfo.buildingId) cells.push(td);
    }
  }
  return cells;
}
function highlightMatrixCells(cells){ clearMatrixSelection(); const cls=isResetMode('matrix')?'mx-reset-selected':'mx-selected'; cells.forEach(td=>td.classList.add(cls)); }
function matrixDragStart(ev, td){
  if(ev.button!==0) return;
  matrixDragState = {active:true, start:matrixCellInfo(td), current:matrixCellInfo(td), moved:false, suppressClick:false};
  highlightMatrixCells([td]);
  ev.preventDefault();
}
function matrixDragEnter(ev, td){
  if(!matrixDragState.active) return;
  const info = matrixCellInfo(td);
  if(info.table!==matrixDragState.start.table || info.buildingId!==matrixDragState.start.buildingId) return;
  matrixDragState.current = info;
  const cells = matrixCellsBetween(matrixDragState.start, info);
  matrixDragState.moved = cells.length>1;
  highlightMatrixCells(cells);
}
function matrixCellClick(ev, td){
  if(matrixDragState.suppressClick || isResetMode('matrix')){ ev.preventDefault(); ev.stopPropagation(); return; }
  const info = matrixCellInfo(td);
  openCellModal(info.buildingId, info.floor, info.processId);
}
function applyMatrixDrag(){
  if(!matrixDragState.active) return;
  const cells = matrixCellsBetween(matrixDragState.start, matrixDragState.current);
  const dragged = matrixDragState.moved && cells.length>1;
  const startInfo = matrixDragState.start;
  matrixDragState.active=false;

  if(isResetMode('matrix')){
    const selected=cells.length?cells:[startInfo.td];
    matrixDragState.suppressClick=true;
    setTimeout(()=>{ matrixDragState.suppressClick=false; },220);
    highlightMatrixCells(selected);
    if(!confirm(`確定重置圈選的 ${selected.length} 格矩陣進度？\n會清除這些樓層／工序的所有施作紀錄。`)){
      clearMatrixSelection();return;
    }
    const proj=currentProject();
    const keys=new Set(selected.map(td=>`${td.dataset.b}|${td.dataset.fl}|${td.dataset.pr}`));
    proj.records=proj.records.filter(r=>!keys.has(`${r.buildingId}|${r.floor}|${r.processId}`));
    scheduleSave();clearMatrixSelection();render();showToast(`已重置 ${selected.length} 格矩陣進度`);
    return;
  }

  if(!dragged){ setTimeout(clearMatrixSelection,80); return; }
  matrixDragState.suppressClick=true;
  setTimeout(()=>{ matrixDragState.suppressClick=false; },220);
  const proj=currentProject();
  const sourceRecs=getRecords(proj.id,startInfo.buildingId,startInfo.floor,startInfo.processId);
  if(!sourceRecs.length){ clearMatrixSelection();showToast('起始格沒有施作記錄，請先點擊新增記錄再拖曳套用','error');return; }
  const b=proj.buildings.find(x=>x.id===startInfo.buildingId);
  const pr=proj.processes.find(x=>x.id===startInfo.processId);
  const sourceLabel=`${b?b.name:''} ${startInfo.floor} ${pr?pr.name:''}`;
  if(!confirm(`是否將起始格「${sourceLabel}」的 ${sourceRecs.length} 筆記錄，覆蓋套用到選取的 ${cells.length} 格？`)){
    clearMatrixSelection();return;
  }
  const selectedKeys=new Set(cells.map(td=>`${td.dataset.b}|${td.dataset.fl}|${td.dataset.pr}`));
  proj.records=proj.records.filter(r=>!selectedKeys.has(`${r.buildingId}|${r.floor}|${r.processId}`));
  const now=Date.now();
  cells.forEach(td=>{
    const info=matrixCellInfo(td);
    sourceRecs.forEach(src=>{
      proj.records.push({
        ...src,id:uid('r'),buildingId:info.buildingId,floor:info.floor,processId:info.processId,
        partIds:[...(src.partIds||[])],updatedAt:now
      });
    });
  });
  scheduleSave();clearMatrixSelection();render();showToast(`已套用 ${cells.length} 格矩陣進度`);
}
document.addEventListener('mouseup', applyMatrixDrag);

function resetAllMatrix(){
  const proj=currentProject();
  const allMode=state.matrixMode==='all';
  const buildingIds=new Set(
    allMode ? proj.buildings.map(b=>b.id) : (currentBuilding()?[currentBuilding().id]:[])
  );
  if(!buildingIds.size) return;
  const scope=allMode?`${proj.name} 全部棟別`:(currentBuilding()?.name||'目前棟別');
  const count=proj.records.filter(r=>buildingIds.has(r.buildingId)).length;
  if(!confirm(`確定全部重置「${scope}」的樓層／工序矩陣？\n將清除 ${count} 筆施作進度紀錄。此動作無法復原，建議先匯出備份。`)) return;
  proj.records=proj.records.filter(r=>!buildingIds.has(r.buildingId));
  scheduleSave();render();showToast(`已全部重置 ${scope} 矩陣進度`);
}

/* =====================  10. 甘特圖／預定工程進度表  ===================== */
const GT_DAY_WIDTH = 34, GT_LABEL_WIDTH = 160;
function getScheduleWindow(proj){
  // 若使用者手動設定顯示範圍則優先採用
  const gr = state.ganttRange;
  if(gr && gr.start && gr.end){
    let s = fromDateStr(gr.start), e = fromDateStr(gr.end);
    if(e < s){ const t=s; s=e; e=t; }
    return {start:s, end:e, manual:true};
  }
  const today = new Date(); today.setHours(0,0,0,0);
  let start = addDays(today,-7), end = addDays(today,90);
  proj.schedules.forEach(s=>{ const sd=fromDateStr(s.startDate), ed=fromDateStr(s.endDate); if(sd<start) start=sd; if(ed>end) end=ed; });
  return {start,end,manual:false};
}
// 甘特圖顯示範圍控制
function setGanttRange(which, val){
  if(!state.ganttRange) state.ganttRange = {start:'', end:''};
  state.ganttRange[which] = val;
  // 兩端都有值才生效；只填一端時以自動範圍的另一端補齊
  if(state.ganttRange.start && !state.ganttRange.end){
    const proj = currentProject(); const auto = (()=>{ const t=new Date(); t.setHours(0,0,0,0); let s=addDays(t,-7),e=addDays(t,90); proj.schedules.forEach(x=>{const sd=fromDateStr(x.startDate),ed=fromDateStr(x.endDate); if(sd<s)s=sd; if(ed>e)e=ed;}); return e; })();
    state.ganttRange.end = toDateStr(auto);
  }
  if(state.ganttRange.end && !state.ganttRange.start){
    const t=new Date(); t.setHours(0,0,0,0);
    state.ganttRange.start = toDateStr(addDays(t,-7));
  }
  scheduleSave(); render();
}
function shiftGanttRange(edge, deltaDays){
  const proj = currentProject();
  const {start,end} = getScheduleWindow(proj);
  if(!state.ganttRange) state.ganttRange = {start:'', end:''};
  if(edge==='start') state.ganttRange.start = toDateStr(addDays(start, deltaDays));
  else state.ganttRange.end = toDateStr(addDays(end, deltaDays));
  if(!state.ganttRange.start) state.ganttRange.start = toDateStr(start);
  if(!state.ganttRange.end) state.ganttRange.end = toDateStr(end);
  // 防止範圍縮到反轉
  if(fromDateStr(state.ganttRange.end) < fromDateStr(state.ganttRange.start)){
    state.ganttRange.end = state.ganttRange.start;
  }
  scheduleSave(); render();
}
function resetGanttRange(){ state.ganttRange = {start:'', end:''}; scheduleSave(); render(); }
function renderGanttRangeBar(proj){
  const {start,end,manual} = getScheduleWindow(proj);
  return `
  <div class="gantt-range-bar">
    <span class="grb-label">顯示日期範圍</span>
    <button type="button" class="btn btn-sm" onclick="shiftGanttRange('start',-30)" title="往前增加30天">◀ +30天</button>
    <button type="button" class="btn btn-sm" onclick="shiftGanttRange('start',30)" title="開頭往後縮短30天">▶ −30天</button>
    <input type="date" value="${toDateStr(start)}" onchange="setGanttRange('start',this.value)">
    <span>～</span>
    <input type="date" value="${toDateStr(end)}" onchange="setGanttRange('end',this.value)">
    <button type="button" class="btn btn-sm" onclick="shiftGanttRange('end',-30)" title="結尾往前縮短30天">◀ −30天</button>
    <button type="button" class="btn btn-sm" onclick="shiftGanttRange('end',30)" title="往後增加30天">+30天 ▶</button>
    ${manual ? `<button type="button" class="btn btn-sm" onclick="resetGanttRange()">回復自動範圍</button>` : `<span class="hint" style="margin:0;">（自動：涵蓋全部排程）</span>`}
  </div>`;
}
// 將排程日期裁切至顯示視窗；完全在視窗外回傳null
function clipToWindow(sd, ed, winStart, winEnd){
  if(ed < winStart || sd > winEnd) return null;
  const cs = sd < winStart ? winStart : sd;
  const ce = ed > winEnd ? winEnd : ed;
  return { colStart: 2+diffDays(winStart, cs), span: Math.max(1, diffDays(cs, ce)+1) };
}
function dateRangeArray(start,end){ const arr=[]; let d=new Date(start); while(d<=end){ arr.push(new Date(d)); d=addDays(d,1); } return arr; }
function pushGanttProcessRows(proj, rows, pr, indented, opts){
  const subs = visibleGanttSubprocesses(proj, pr.id);
  if(subs.length){
    const expandKey = (opts.keyPrefix||'')+'process:'+pr.id;
    const expanded = opts.expandAll || formState.ganttExpanded[expandKey] !== false; // 預設展開，方便看到子工序
    rows.push({type:'process', process:pr, indented, hasChildren:true, expandKey, expanded});
    if(expanded) subs.forEach(sp=>rows.push({type:'subprocess', process:pr, sub:sp, indented:true, parentIndented:indented}));
  }else{
    rows.push({type:'process', process:pr, indented:false});
  }
}
function buildGanttDisplayRows(proj, opts){
  // 建立「大項目→施工工序→子工序」的顯示順序；未分組的工序維持原本單一列顯示
  // opts.expandAll=true 時（PDF匯出）全部展開；否則依 formState.ganttExpanded 決定
  // opts.keyPrefix 用於全棟模式下區分不同棟別／分組／工序的展開狀態
  opts = opts || {};
  ensureGanttSubprocessStore(proj);
  if(!formState.ganttExpanded) formState.ganttExpanded = {};
  const rows = [];
  const grouped = new Set();
  const targetBuilding=buildingById(proj,opts.buildingId)||currentBuilding();
  const localGroups=buildingProcessGroups(proj,targetBuilding);
  const localProcesses=buildingProcesses(proj,targetBuilding);
  localGroups.forEach(g=>{
    const members = localProcesses.filter(pr=>pr.groupId===g.id);
    if(members.length===0) return; // 分組底下沒有工項時不顯示空的分組列
    members.forEach(pr=>grouped.add(pr.id));
    const expandKey = (opts.keyPrefix||'')+g.id;
    const expanded = opts.expandAll || !!formState.ganttExpanded[expandKey];
    rows.push({type:'group', group:g, expandKey, expanded});
    if(expanded) members.forEach(pr=>pushGanttProcessRows(proj, rows, pr, true, opts));
  });
  localProcesses.forEach(pr=>{ if(!grouped.has(pr.id)) pushGanttProcessRows(proj, rows, pr, false, opts); });
  return rows;
}
function toggleGanttGroup(expandKey){
  if(!formState.ganttExpanded) formState.ganttExpanded = {};
  formState.ganttExpanded[expandKey] = !formState.ganttExpanded[expandKey];
  render();
}
// 大項目摘要：大項目日期＝底下各「母工序」日期總和；母工序日期再由其子工序／排程彙總。
function groupSummaryInfo(proj, b, group){
  const members = buildingProcesses(proj,b).filter(pr=>pr.groupId===group.id);
  const ranges = members.map(pr=>processSummaryInfo(proj,b,pr).range).filter(Boolean);
  let range = null;
  if(ranges.length){
    const minStart = ranges.reduce((m,r)=>r.minStart<m?r.minStart:m, ranges[0].minStart);
    const maxEnd = ranges.reduce((m,r)=>r.maxEnd>m?r.maxEnd:m, ranges[0].maxEnd);
    range = {minStart, maxEnd};
  }
  const memberIds = new Set(members.map(pr=>pr.id));
  const memberAvgs = buildingProcessAverages(proj, b).filter(x=>memberIds.has(x.process.id));
  const avg = memberAvgs.length ? Math.round(memberAvgs.reduce((s,x)=>s+x.avg,0)/memberAvgs.length) : 0;
  return { range, avg };
}
function fmtShortDate(d){ return (d.getMonth()+1)+'/'+d.getDate(); }
function scheduleLabel(proj, b, s){
  const pr = proj.processes.find(x=>x.id===s.processId);
  const sub = ganttSubprocessName(proj, s.processId, s.subProcessId);
  const name = `${pr?pr.name:'(未知工序)'}${sub?'／'+sub:''}`;
  return `${name} ${compressFloorLabel(b, s.floors)}（${s.startDate}～${s.endDate}）`;
}

function renderGanttProcessLikeRow(proj, b, row, days, start, end, todayS, gridRow, allMode){
  const pr = row.process;
  if(row.type==='process' && row.hasChildren){
    const info = processSummaryInfo(proj, b, pr);
    const rangeText = info.range ? `${fmtShortDate(info.range.minStart)}～${fmtShortDate(info.range.maxEnd)}` : '未排程';
    const pad = allMode ? (row.indented?'padding-left:40px;':'padding-left:22px;') : '';
    const label = `<div class="gt-row-label gt-clickable ${row.indented?'gt-child-label':''}" style="grid-column:1;grid-row:${gridRow};${pad}" onclick="toggleGanttGroup('${row.expandKey}')" title="點擊${row.expanded?'收合':'展開'}子工序　${esc(pr.name)}　${rangeText}　平均 ${info.avg}%">
      <span class="gt-caret">${row.expanded?'▼':'▶'}</span>
      <span class="gt-gh-text"><span>${esc(pr.name)}</span><span class="gt-group-sub">${rangeText}・均 ${info.avg}%</span></span>
    </div>`;
    const trackCells = days.map((d,i)=>{
      const isWeekend = d.getDay()===0||d.getDay()===6;
      return `<div class="gt-day-cell gt-group-track ${isWeekend?'gt-weekend':''}" style="grid-column:${i+2};grid-row:${gridRow};" onclick="toggleGanttGroup('${row.expandKey}')"></div>`;
    }).join('');
    let summaryBar='';
    if(info.range){
      const clip = clipToWindow(info.range.minStart, info.range.maxEnd, start, end);
      if(clip) summaryBar = `<div class="gt-group-bar" style="grid-column:${clip.colStart} / span ${clip.span};grid-row:${gridRow};pointer-events:none;" title="${esc(pr.name)}　${toDateStr(info.range.minStart)}～${toDateStr(info.range.maxEnd)}　平均 ${info.avg}%"></div>`;
    }
    return label+trackCells+summaryBar;
  }

  const sub = row.type==='subprocess' ? row.sub : null;
  const rowLabel = sub ? sub.name : pr.name;
  const fullTitle = sub ? `${pr.name}／${sub.name}` : pr.name;
  const pad = allMode ? (sub ? 'padding-left:58px;' : (row.indented?'padding-left:40px;':'padding-left:22px;')) : '';
  const labelClass = `${sub || row.indented ? 'gt-child-label' : ''}`;
  const label = `<div class="gt-row-label ${labelClass}" style="grid-column:1;grid-row:${gridRow};${pad}" title="${esc(b.name)}　${esc(fullTitle)}">${sub?'└ ':''}${esc(rowLabel)}</div>`;
  const dayCells = days.map((d,i)=>{
    const isWeekend = d.getDay()===0||d.getDay()===6;
    const subArg = sub ? `,'${sub.id}'` : '';
    return `<div class="gt-day-cell ${isWeekend?'gt-weekend':''}" data-greset="1" data-gb="${b.id}" data-gpr="${pr.id}" data-gsub="${sub?sub.id:''}" data-gdate="${toDateStr(d)}" data-grow="${gridRow}" data-gcol="${i+2}" style="grid-column:${i+2};grid-row:${gridRow};" onmousedown="ganttResetStart(event,this)" onmouseenter="ganttResetEnter(event,this)" ondblclick="if(!isResetMode('gantt'))openScheduleCreateModal('${b.id}','${pr.id}','${toDateStr(d)}'${subArg})"></div>`;
  }).join('');
  const bars = proj.schedules.filter(s=>{
    if(s.buildingId!==b.id || s.processId!==pr.id) return false;
    if(sub) return s.subProcessId===sub.id;
    return !s.subProcessId || !visibleGanttSubprocesses(proj, pr.id).length;
  }).map(s=>{
    const sd=fromDateStr(s.startDate), ed=fromDateStr(s.endDate);
    const clip = clipToWindow(sd, ed, start, end);
    if(!clip) return ''; // 排程完全在顯示範圍之外
    const floorLabel = compressFloorLabel(b, s.floors);
    const isLate = !s.actualCompleteDate && ed < fromDateStr(todayS);
    const isDone = !!s.actualCompleteDate;
    const cls = isDone ? 'gt-done' : (isLate ? 'gt-late' : '');
    const hasDep = (s.dependsOn||[]).length>0;
    const depNames = hasDep ? (s.dependsOn.map(depId=>{ const dep=proj.schedules.find(x=>x.id===depId); return dep?scheduleLabel(proj,b,dep):null; }).filter(Boolean).join('；')) : '';
    const subName = ganttSubprocessName(proj, s.processId, s.subProcessId);
    const tip = `${esc(pr.name)}${subName?'／'+esc(subName):''}　${esc(floorLabel)}　${esc(s.startDate)}～${esc(s.endDate)}${s.actualCompleteDate?'　實際完成:'+esc(s.actualCompleteDate):''}${s.note?'　'+esc(s.note):''}${hasDep?'　前置任務:'+esc(depNames):''}`;
    return `<div class="gt-bar ${cls} ${hasDep?'gt-has-dep':''}" data-sid="${s.id}" style="grid-column:${clip.colStart} / span ${clip.span};grid-row:${gridRow};" title="${tip}">
      <div class="gt-bar-body" onclick="openScheduleEditModal('${s.id}')">${esc(floorLabel)}</div>
      <div class="gt-bar-handle" onmousedown="ganttResizeMouseDown(event,'${s.id}')"></div>
    </div>`;
  }).join('');
  return label+dayCells+bars;
}

let ganttResetDrag=null;
let suppressGanttResetClick=false;

function ganttResetInfo(el){
  return {
    el,
    grid:el.closest('.gantt-grid,.dual-gantt-grid'),
    buildingId:el.dataset.gb||'',
    processId:el.dataset.gpr||'',
    subProcessId:el.dataset.gsub||'',
    scheduleId:el.dataset.gsid||'',
    date:el.dataset.gdate||'',
    row:Number(el.dataset.grow||0),
    col:Number(el.dataset.gcol||0)
  };
}
function clearGanttResetSelection(){
  document.querySelectorAll('.gantt-reset-selected').forEach(el=>el.classList.remove('gantt-reset-selected'));
}
function ganttResetCellsBetween(a,b){
  if(!a||!b||a.grid!==b.grid) return [];
  const r1=Math.min(a.row,b.row),r2=Math.max(a.row,b.row);
  const c1=Math.min(a.col,b.col),c2=Math.max(a.col,b.col);
  return [...a.grid.querySelectorAll('[data-greset="1"]')].filter(el=>{
    const r=Number(el.dataset.grow||0),c=Number(el.dataset.gcol||0);
    return r>=r1&&r<=r2&&c>=c1&&c<=c2;
  });
}
function highlightGanttResetCells(cells){
  clearGanttResetSelection();
  cells.forEach(el=>el.classList.add('gantt-reset-selected'));
}
function ganttResetStart(ev,el){
  if(!isResetMode('gantt')||ev.button!==0) return;
  const info=ganttResetInfo(el);
  ganttResetDrag={start:info,current:info,cells:[el]};
  highlightGanttResetCells([el]);
  ev.preventDefault();ev.stopPropagation();
  document.addEventListener('mouseup',ganttResetEnd,{once:true});
}
function ganttResetEnter(ev,el){
  if(!isResetMode('gantt')||!ganttResetDrag||!(ev.buttons&1)) return;
  const info=ganttResetInfo(el);
  if(info.grid!==ganttResetDrag.start.grid) return;
  ganttResetDrag.current=info;
  ganttResetDrag.cells=ganttResetCellsBetween(ganttResetDrag.start,info);
  highlightGanttResetCells(ganttResetDrag.cells);
}
function scheduleMatchesResetTarget(proj,s,target){
  if(target.scheduleId) return s.id===target.scheduleId;
  if(s.buildingId!==target.buildingId||s.processId!==target.processId) return false;
  if(target.subProcessId) return s.subProcessId===target.subProcessId;
  return !s.subProcessId || !visibleGanttSubprocesses(proj,s.processId).length;
}
function subtractScheduleRange(s,resetStart,resetEnd){
  const sd=fromDateStr(s.startDate),ed=fromDateStr(s.endDate);
  if(ed<resetStart||sd>resetEnd) return [s];

  // 整段皆在圈選範圍內：刪除。
  if(resetStart<=sd&&resetEnd>=ed) return [];

  // 圈選切掉前段。
  if(resetStart<=sd&&resetEnd<ed){
    return [{
      ...s,
      startDate:toDateStr(addDays(resetEnd,1)),
      actualStartDate:null,
      actualCompleteDate:null
    }];
  }

  // 圈選切掉後段。
  if(resetStart>sd&&resetEnd>=ed){
    return [{
      ...s,
      endDate:toDateStr(addDays(resetStart,-1)),
      actualStartDate:null,
      actualCompleteDate:null
    }];
  }

  // 圈選位於中間：保留左右兩段，拆成兩筆排程。
  return [
    {
      ...s,
      endDate:toDateStr(addDays(resetStart,-1)),
      actualStartDate:null,
      actualCompleteDate:null
    },
    {
      ...s,
      id:uid('sc'),
      startDate:toDateStr(addDays(resetEnd,1)),
      actualStartDate:null,
      actualCompleteDate:null
    }
  ];
}
function ganttResetEnd(){
  if(!ganttResetDrag) return;
  const d=ganttResetDrag;ganttResetDrag=null;
  const cells=d.cells?.length?d.cells:[d.start.el];
  highlightGanttResetCells(cells);

  const infos=cells.map(ganttResetInfo);
  const dates=infos.map(x=>x.date).filter(Boolean).sort();
  if(!dates.length){clearGanttResetSelection();return;}
  const resetStart=fromDateStr(dates[0]),resetEnd=fromDateStr(dates[dates.length-1]);

  const targetMap=new Map();
  infos.forEach(x=>{
    const key=x.scheduleId?`sid:${x.scheduleId}`:`row:${x.buildingId}|${x.processId}|${x.subProcessId}`;
    targetMap.set(key,x);
  });
  const targets=[...targetMap.values()];
  const proj=currentProject();

  const affected=proj.schedules.filter(s=>targets.some(t=>scheduleMatchesResetTarget(proj,s,t))&&!(fromDateStr(s.endDate)<resetStart||fromDateStr(s.startDate)>resetEnd));
  if(!affected.length){
    clearGanttResetSelection();showToast('圈選範圍內沒有排程可重置');return;
  }

  const label=`${toDateStr(resetStart)}～${toDateStr(resetEnd)}`;
  if(!confirm(`確定重置圈選的甘特範圍？\n日期：${label}\n影響 ${affected.length} 筆排程。\n跨出圈選範圍的排程會保留未被圈選的部分。`)){
    clearGanttResetSelection();return;
  }

  const next=[];
  proj.schedules.forEach(s=>{
    const matched=targets.some(t=>scheduleMatchesResetTarget(proj,s,t));
    if(!matched){next.push(s);return;}
    subtractScheduleRange(s,resetStart,resetEnd).forEach(x=>next.push(x));
  });
  proj.schedules=next;
  clearGanttResetSelection();
  scheduleSave();render();showToast(`已重置甘特範圍 ${label}`);
}
function resetAllGantt(){
  const proj=currentProject();
  const allMode=state.ganttMode==='all';
  const buildingIds=new Set(allMode?proj.buildings.map(b=>b.id):(currentBuilding()?[currentBuilding().id]:[]));
  if(!buildingIds.size) return;
  const scope=allMode?`${proj.name} 全部棟別`:(currentBuilding()?.name||'目前棟別');
  const count=proj.schedules.filter(s=>buildingIds.has(s.buildingId)).length;
  if(!confirm(`確定全部重置「${scope}」的甘特排程？\n將刪除 ${count} 筆預定排程；矩陣與實際進度資料不會刪除。此動作無法復原，建議先匯出備份。`)) return;
  proj.schedules=proj.schedules.filter(s=>!buildingIds.has(s.buildingId));
  clearGanttResetSelection();
  scheduleSave();render();showToast(`已全部重置 ${scope} 甘特排程`);
}
