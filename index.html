function plannedProgressAtDate(s, dateObj){
  const start=fromDateStr(s.startDate), end=fromDateStr(s.endDate);
  if(dateObj<start) return 0;
  if(dateObj>=end) return 100;
  const total=Math.max(1,diffDays(start,end)+1);
  const elapsed=Math.max(0,diffDays(start,dateObj)+1);
  return clamp(Math.round(elapsed/total*100),0,100);
}
function scheduleActualProgress(proj,b,s){
  if(s.actualCompleteDate) return 100;
  const floors=(s.floors||[]).filter(fl=>b.floors.includes(fl));
  if(!floors.length) return 0;
  const vals=floors.map(fl=>matrixCellStats(proj,b.id,fl,s.processId).avg);
  return vals.length?Math.round(vals.reduce((a,v)=>a+v,0)/vals.length):0;
}
function inferredScheduleActualStart(proj,s){
  if(s.actualStartDate) return fromDateStr(s.actualStartDate);
  const floorSet=new Set(s.floors||[]);
  const matches=proj.records.filter(r=>
    r.buildingId===s.buildingId &&
    r.processId===s.processId &&
    (!floorSet.size || floorSet.has(r.floor)) &&
    (Number(r.progress||0)>0 || r.status==='done' || r.status==='in_progress')
  );
  if(matches.length){
    const first=matches.reduce((m,r)=>Math.min(m,Number(r.updatedAt||Infinity)),Infinity);
    if(isFinite(first)){
      const d=new Date(first);d.setHours(0,0,0,0);return d;
    }
  }
  return null;
}
function scheduleVariance(actualPct,planPct){
  return actualPct-planPct;
}
function dualScheduleRows(proj, buildings){
  const rows=[];
  buildings.forEach(b=>{
    if(buildings.length>1) rows.push({type:'building',b});
    const schedules=[...proj.schedules]
      .filter(s=>s.buildingId===b.id)
      .sort((a,c)=>a.startDate.localeCompare(c.startDate)||a.endDate.localeCompare(c.endDate));
    let lastGroup='',lastProcess='';
    schedules.forEach(s=>{
      const pr=proj.processes.find(x=>x.id===s.processId);
      if(!pr) return;
      const group=proj.processGroups.find(g=>g.id===pr.groupId);
      const groupName=group?.name||'未分組';
      if(groupName!==lastGroup){
        rows.push({type:'group',b,name:groupName});
        lastGroup=groupName;lastProcess='';
      }
      const sub=ganttSubprocessName(proj,s.processId,s.subProcessId);
      const processKey=pr.id+'|'+(sub||'');
      if(processKey!==lastProcess){
        rows.push({type:'processHeader',b,pr,sub});
        lastProcess=processKey;
      }
      rows.push({type:'schedule',b,pr,sub,s});
    });
  });
  return rows;
}
function renderDualTrackGantt(proj){
  const allMode=state.ganttMode==='all';
  const buildings=allMode?proj.buildings:(currentBuilding()?[currentBuilding()]:[]);
  if(!buildings.length){
    return `<div class="empty-state"><h3>尚未建立棟別</h3><button class="btn btn-primary" onclick="openAddBuildingModal()">${ICO.plus} 新增棟別</button></div>`;
  }
  if(!proj.schedules.length){
    return `<div class="empty-state"><h3>尚未建立排程</h3><p>請先切回原甘特圖，雙擊日期格建立排程。</p><button class="btn btn-primary" onclick="setGanttPresentation('classic')">回到原甘特圖</button></div>`;
  }

  const {start,end}=getScheduleWindow(proj);
  const days=dateRangeArray(start,end);
  const today=fromDateStr(todayStr());
  const todayS=todayStr();
  const rows=dualScheduleRows(proj,buildings);
  const labelWidth=255;

  const scheduleRows=rows.filter(r=>r.type==='schedule');
  const stats=scheduleRows.map(r=>{
    const actual=scheduleActualProgress(proj,r.b,r.s);
    const plan=plannedProgressAtDate(r.s,today);
    return {actual,plan,variance:actual-plan,late:!r.s.actualCompleteDate&&fromDateStr(r.s.endDate)<today&&actual<100};
  });
  const avgActual=stats.length?Math.round(stats.reduce((a,x)=>a+x.actual,0)/stats.length):0;
  const avgPlan=stats.length?Math.round(stats.reduce((a,x)=>a+x.plan,0)/stats.length):0;
  const avgVar=avgActual-avgPlan;
  const lateCount=stats.filter(x=>x.late).length;

  const head=days.map((d,i)=>{
    const ds=toDateStr(d),wk=d.getDay()===0||d.getDay()===6;
    return `<div class="dual-head ${wk?'weekend':''} ${ds===todayS?'today':''}" style="grid-column:${i+2};grid-row:1;">
      <span style="font-size:10px;font-weight:800;">${d.getMonth()+1}/${d.getDate()}</span>
      <span style="font-size:8px;opacity:.75;">${['日','一','二','三','四','五','六'][d.getDay()]}</span>
    </div>`;
  }).join('');

  const body=rows.map((row,ri)=>{
    const gr=ri+2;
    if(row.type==='building'){
      const cells=days.map((d,i)=>`<div class="dual-group-cell" style="grid-column:${i+2};grid-row:${gr};"></div>`).join('');
      const localNames=buildingProcesses(proj,row.b).map(x=>x.name).join('、')||'尚未設定工序';
      return `<div class="dual-group-label dual-building-editable" style="grid-column:1;grid-row:${gr};background:var(--orange);" onclick="openSettingsModal('processes','${proj.id}','${row.b.id}')" title="${esc(localNames)}｜點擊編輯本棟工序">${esc(row.b.name)}<span style="display:block;font-size:9px;font-weight:500;opacity:.86;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(localNames)}</span></div>${cells}`;
    }
    if(row.type==='group'){
      const cells=days.map((d,i)=>`<div class="dual-group-cell" style="grid-column:${i+2};grid-row:${gr};"></div>`).join('');
      return `<div class="dual-group-label" style="grid-column:1;grid-row:${gr};">${esc(row.name)}</div>${cells}`;
    }
    if(row.type==='processHeader'){
      const cells=days.map((d,i)=>`<div class="dual-group-cell" style="grid-column:${i+2};grid-row:${gr};background:#F8FAFC;"></div>`).join('');
      return `<div class="dual-group-label" style="grid-column:1;grid-row:${gr};background:var(--navy-2);padding-left:22px;">${esc(row.pr.name)}${row.sub?'／'+esc(row.sub):''}</div>${cells}`;
    }

    const s=row.s,b=row.b,pr=row.pr;
    const actualPct=scheduleActualProgress(proj,b,s);
    const planPct=plannedProgressAtDate(s,today);
    const variance=scheduleVariance(actualPct,planPct);
    const actualStart=inferredScheduleActualStart(proj,s);
    const actualEnd=s.actualCompleteDate?fromDateStr(s.actualCompleteDate):(actualStart?today:null);
    const isLate=!s.actualCompleteDate&&fromDateStr(s.endDate)<today&&actualPct<100;
    const isDone=!!s.actualCompleteDate||actualPct>=100;
    const actualCls=isDone?'done':(isLate?'late':(variance>=10?'ahead':''));
    const varianceCls=variance>3?'good':(variance<-3?'bad':'neutral');
    const varianceText=variance>0?`實際超前 ${variance}%`:(variance<0?`實際落後 ${Math.abs(variance)}%`:'實際符合計畫');
    const floorLabel=taskFloorLabel(b,s.floors)||compressFloorLabel(b,s.floors);
    const label=`<div class="dual-label" style="grid-column:1;grid-row:${gr};" onclick="openScheduleEditModal('${s.id}')">
      <div class="dl-name">${esc(floorLabel||'未指定樓層')}</div>
      <div class="dl-meta">預計 ${esc(s.startDate)}～${esc(s.endDate)}${s.actualStartDate?'｜實際起 '+esc(s.actualStartDate):''}</div>
      <div class="dl-variance ${varianceCls}">計畫 ${planPct}%｜實際 ${actualPct}%｜${varianceText}</div>
    </div>`;
    const cells=days.map((d,i)=>{
      const wk=d.getDay()===0||d.getDay()===6;
      return `<div class="dual-cell ${wk?'weekend':''}" data-greset="1" data-gsid="${s.id}" data-gb="${b.id}" data-gpr="${pr.id}" data-gsub="${s.subProcessId||''}" data-gdate="${toDateStr(d)}" data-grow="${gr}" data-gcol="${i+2}" style="grid-column:${i+2};grid-row:${gr};" onmousedown="ganttResetStart(event,this)" onmouseenter="ganttResetEnter(event,this)" ondblclick="if(!isResetMode('gantt'))openScheduleCreateModal('${b.id}','${pr.id}','${toDateStr(d)}'${s.subProcessId?`,'${s.subProcessId}'`:''})"></div>`;
    }).join('');

    const planClip=clipToWindow(fromDateStr(s.startDate),fromDateStr(s.endDate),start,end);
    const planBar=planClip?`<div class="dual-plan-bar" style="grid-column:${planClip.colStart}/span ${planClip.span};grid-row:${gr};" title="預計：${esc(s.startDate)}～${esc(s.endDate)}"></div>`:'';

    let actualBar='';
    let actualText='';
    if(actualStart&&actualEnd){
      const ac=clipToWindow(actualStart,actualEnd,start,end);
      if(ac){
        actualBar=`<div class="dual-actual-bar ${actualCls}" style="grid-column:${ac.colStart}/span ${ac.span};grid-row:${gr};" onclick="openScheduleEditModal('${s.id}')" title="實際：${toDateStr(actualStart)}～${s.actualCompleteDate?esc(s.actualCompleteDate):'進行中'}｜完成 ${actualPct}%"></div>`;
        const labelCol=Math.min(days.length+1,ac.colStart+ac.span);
        actualText=`<div class="dual-actual-pct" style="grid-column:${labelCol};grid-row:${gr};">${actualPct}%</div>`;
      }
    }else{
      actualText=`<div class="dual-no-actual" style="grid-column:2/span ${Math.min(4,days.length)};grid-row:${gr};">尚無實際開始紀錄</div>`;
    }
    return label+cells+planBar+actualBar+actualText;
  }).join('');

  const todayIdx=diffDays(start,today);
  const todayLine=(todayIdx>=0&&todayIdx<days.length)
    ?`<div class="dual-today-line" style="grid-column:${todayIdx+2};grid-row:1/span ${rows.length+1};"></div>`:'';

  return `
    ${renderGanttBuildingConfigPanel(proj,buildings)}
    ${renderGanttRangeBar(proj)}
    <div class="dual-summary-row">
      <div class="dual-summary-card"><div class="dsc-label">目前計畫進度</div><div class="dsc-value">${avgPlan}%</div><div class="dsc-sub">依今日日期與預定工期推算</div></div>
      <div class="dual-summary-card ${avgVar>=0?'good':'bad'}"><div class="dsc-label">目前實際進度</div><div class="dsc-value">${avgActual}%</div><div class="dsc-sub">依矩陣各樓層工序完成度彙整</div></div>
      <div class="dual-summary-card ${avgVar>=0?'good':'bad'}"><div class="dsc-label">進度差異</div><div class="dsc-value">${avgVar>0?'+':''}${avgVar}%</div><div class="dsc-sub">${avgVar>=0?'整體符合或超前':'整體落後計畫'}</div></div>
      <div class="dual-summary-card ${lateCount?'bad':'good'}"><div class="dsc-label">逾期未完成</div><div class="dsc-value">${lateCount}</div><div class="dsc-sub">預定完成日已過且未達 100%</div></div>
    </div>
    <div class="dual-gantt-scroll">
      <div class="dual-gantt-grid" style="grid-template-columns:${labelWidth}px repeat(${days.length},${GT_DAY_WIDTH}px);grid-template-rows:40px repeat(${rows.length},58px);">
        <div class="dual-corner" style="grid-column:1;grid-row:1;">工序／樓層｜計畫與實際</div>
        ${head}${body}${todayLine}
      </div>
    </div>
    <div class="dual-track-legend">
      <span><i class="plan"></i>上軌：預計工期</span>
      <span><i style="background:var(--orange);"></i>下軌：實際進行中</span>
      <span><i style="background:var(--green);"></i>實際完成</span>
      <span><i style="background:var(--red);"></i>逾期未完成</span>
      <span><i style="background:var(--blue);"></i>實際明顯超前計畫</span>
      <span>實際百分比來自樓層／工序矩陣，不需在甘特圖另外拉百分比。</span>
    </div>
    <div style="margin-top:14px;">
      <button class="btn" onclick="exportDualGanttPDF()">${ICO.printer} 匯出預計 vs 實際 PDF（A4橫向）</button>
      <button class="btn" onclick="setGanttPresentation('classic')">返回原甘特圖編輯排程</button>
      <span class="hint">${allMode?'請由上方各棟卡片分別編輯工序與部位。':'目前只顯示 '+esc(buildings[0]?.name||'目前棟別')+' 的獨立工序。'}</span>
    </div>`;
}

/* ---------- 匯出 PDF（A4橫向，日期超出單頁範圍時自動分頁，工序列於每頁重複，日期自上頁最後一天接續） ---------- */
const GANTT_PRINT_DAYS_PER_PAGE = 30; // 放大版面後，依 A4 橫向可印範圍重新抓的每頁天數
function buildGanttPrintHTML(proj, b){
  const { start, end } = getScheduleWindow(proj);
  const allDays = dateRangeArray(start, end);
  const dayPages = [];
  for(let i=0; i<allDays.length; i+=GANTT_PRINT_DAYS_PER_PAGE){ dayPages.push(allDays.slice(i, i+GANTT_PRINT_DAYS_PER_PAGE)); }
  if(dayPages.length===0) dayPages.push([]);

  // === 自適應版面計算：確保永遠不超出 A4 橫向可印範圍 ===
  // A4 橫向 297×210mm，扣 8mm 邊界 → 可印 281×194mm；再扣頁首列約 8mm
  const PAGE_W = 279, PAGE_H = 184; // 保守值，預留誤差
  const labelMm = 32;
  // 欄寬依「本組頁面實際天數」自適應：天數少時欄位自動加寬（上限 12mm）
  const maxDaysInPage = Math.max(1, ...dayPages.map(p=>p.length));
  const dayMm = Math.min(12, Math.floor(((PAGE_W - labelMm) / maxDaysInPage) * 10) / 10);
  // 列高依列數自適應：列多時自動壓縮（下限 5mm），仍放不下就垂直分頁
  const allRows = buildGanttDisplayRows(proj, {expandAll:true,buildingId:b.id});
  const dateRowMm = 8;
  const availH = PAGE_H - dateRowMm;
  let rowMm = 9;
  if(allRows.length * rowMm > availH) rowMm = Math.max(5, Math.floor((availH / allRows.length) * 10) / 10);
  const maxRowsPerPage = Math.max(1, Math.floor(availH / rowMm));
  // 垂直分段：列數超過單頁容量時切成多段，每段重複日期表頭
  const rowChunks = [];
  for(let i=0; i<allRows.length; i+=maxRowsPerPage){ rowChunks.push(allRows.slice(i, i+maxRowsPerPage)); }
  if(rowChunks.length===0) rowChunks.push([]);
  // 字級隨列高縮放
  const labelFs = rowMm>=8 ? 9 : (rowMm>=6.5 ? 8 : 7);
  const barFs = rowMm>=8 ? 8 : (rowMm>=6.5 ? 7 : 6);
  const totalPages = dayPages.length * rowChunks.length;

  const pagesHtml = [];
  dayPages.forEach((days, dpIdx)=>{
    const pageStart = days[0], pageEnd = days[days.length-1];
    const colgroup = `<colgroup><col style="width:${labelMm}mm">${days.map(()=>`<col style="width:${dayMm}mm">`).join('')}</colgroup>`;
    const headRow = `<tr style="height:${dateRowMm}mm;">
      <th class="gp-corner">工序 ＼ 日期</th>
      ${days.map(d=>{
        const isWeekend = d.getDay()===0 || d.getDay()===6;
        const wd = ['日','一','二','三','四','五','六'][d.getDay()];
        return `<th class="gp-head-cell ${isWeekend?'gp-weekend':''}">${d.getMonth()+1}/${d.getDate()}<br>(${wd})</th>`;
      }).join('')}
    </tr>`;

    rowChunks.forEach((displayRows, rcIdx)=>{
      // 依「大項目→子項目」順序列出；每列用 colspan 合併出排程色塊，其餘為單日空白格，
      // 結構上不可能互相重疊（table 本身保證每格只會被佔用一次）
      const bodyRows = displayRows.map(row=>{
        if(row.type==='group'){
          const memberIds = new Set(proj.processes.filter(pr=>pr.groupId===row.group.id).map(pr=>pr.id));
          const segs = proj.schedules
            .filter(s=>s.buildingId===b.id && memberIds.has(s.processId))
            .map(s=>{
              const sd = fromDateStr(s.startDate), ed = fromDateStr(s.actualCompleteDate||s.endDate);
              if(ed < pageStart || sd > pageEnd) return null;
              const clipStart = sd < pageStart ? pageStart : sd;
              const clipEnd = ed > pageEnd ? pageEnd : ed;
              return { startIdx: diffDays(pageStart, clipStart), span: diffDays(clipStart, clipEnd)+1 };
            }).filter(Boolean);
          let cells = '';
          if(segs.length){
            const minIdx = Math.min(...segs.map(s=>s.startIdx));
            const maxIdx = Math.max(...segs.map(s=>s.startIdx+s.span));
            if(minIdx>0) cells += `<td class="gp-day-cell" colspan="${minIdx}"></td>`;
            cells += `<td class="gp-bar-cell" colspan="${maxIdx-minIdx}"><div class="gp-bar gp-group-bar"></div></td>`;
            if(maxIdx<days.length) cells += `<td class="gp-day-cell" colspan="${days.length-maxIdx}"></td>`;
          } else {
            cells = `<td class="gp-day-cell" colspan="${days.length}"></td>`;
          }
          return `<tr style="height:${rowMm}mm;"><td class="gp-row-label gp-group-label">${esc(row.group.name)}</td>${cells}</tr>`;
        }
        const pr = row.process;
        const sub = row.type==='subprocess' ? row.sub : null;
        if(row.type==='process' && row.hasChildren){
          const info = processSummaryInfo(proj, b, pr);
          let cells = '';
          if(info.range){
            const sd = info.range.minStart, ed = info.range.maxEnd;
            if(!(ed < pageStart || sd > pageEnd)){
              const clipStart = sd < pageStart ? pageStart : sd;
              const clipEnd = ed > pageEnd ? pageEnd : ed;
              const startIdx = diffDays(pageStart, clipStart);
              const span = diffDays(clipStart, clipEnd)+1;
              if(startIdx>0) cells += `<td class="gp-day-cell" colspan="${startIdx}"></td>`;
              cells += `<td class="gp-bar-cell" colspan="${span}"><div class="gp-bar gp-group-bar"></div></td>`;
              const endIdx = startIdx+span;
              if(endIdx<days.length) cells += `<td class="gp-day-cell" colspan="${days.length-endIdx}"></td>`;
            }
          }
          if(!cells) cells = `<td class="gp-day-cell" colspan="${days.length}"></td>`;
          return `<tr style="height:${rowMm}mm;"><td class="gp-row-label gp-child-label">${esc('▾ '+pr.name)}</td>${cells}</tr>`;
        }
        const segs = proj.schedules
          .filter(s=>{
            if(s.buildingId!==b.id || s.processId!==pr.id) return false;
            if(sub) return s.subProcessId===sub.id;
            return !s.subProcessId || !visibleGanttSubprocesses(proj, pr.id).length;
          })
          .map(s=>{
            const sd = fromDateStr(s.startDate), ed = fromDateStr(s.endDate);
            if(ed < pageStart || sd > pageEnd) return null; // 此排程與本頁日期範圍無重疊
            const clipStart = sd < pageStart ? pageStart : sd;
            const clipEnd = ed > pageEnd ? pageEnd : ed;
            const startIdx = diffDays(pageStart, clipStart);
            const span = diffDays(clipStart, clipEnd) + 1;
            const isDone = !!s.actualCompleteDate;
            const isLate = !isDone && ed < fromDateStr(todayStr());
            return { startIdx, span, label: compressFloorLabel(b, s.floors), cls: isDone?'gp-done':(isLate?'gp-late':'') };
          })
          .filter(Boolean)
          .sort((a,c)=>a.startIdx-c.startIdx);

        let cells = '';
        let i = 0, segPtr = 0;
        while(i < days.length){
          const seg = segs[segPtr];
          if(seg && seg.startIdx===i){
            const segWidthMm = seg.span * dayMm - 2;
            cells += `<td class="gp-bar-cell" colspan="${seg.span}"><div class="gp-bar ${seg.cls}" style="max-width:${segWidthMm}mm;">${esc(seg.label)}</div></td>`;
            i += seg.span; segPtr++;
          } else {
            cells += `<td class="gp-day-cell"></td>`;
            i += 1;
          }
        }
        const labelText = sub ? ('　└ '+sub.name) : ((row.indented ? '　└ ' : '') + pr.name);
        return `<tr style="height:${rowMm}mm;"><td class="gp-row-label ${sub||row.indented?'gp-child-label':''}">${esc(labelText)}</td>${cells}</tr>`;
      }).join('');

      const pageNo = dpIdx * rowChunks.length + rcIdx + 1;
      pagesHtml.push(`
      <div class="gantt-print-page" style="--gp-label-fs:${labelFs}px;--gp-bar-fs:${barFs}px;">
        <div class="gp-header">
          <span>${esc(proj.name)}　${esc(b.name)}　預定工程進度表</span>
          <span>第 ${pageNo} / ${totalPages} 頁　${days.length?toDateStr(pageStart)+' ～ '+toDateStr(pageEnd):''}${rowChunks.length>1?`　（工項 ${rcIdx+1}/${rowChunks.length} 段）`:''}</span>
        </div>
        <div class="gp-canvas">
          <table class="gp-table">
            ${colgroup}
            <thead>${headRow}</thead>
            <tbody>${bodyRows}</tbody>
          </table>
        </div>
      </div>`);
    });
  });
  return pagesHtml.join('');
}

/* ---------- 預計 vs 實際雙軌甘特圖 PDF ---------- */
const DUAL_PRINT_DAYS_PER_PAGE = 28;
const DUAL_PRINT_ITEMS_PER_PAGE = 14;

function dualPrintSummary(proj,b,schedules){
  const today=fromDateStr(todayStr());
  const stats=schedules.map(s=>{
    const actual=scheduleActualProgress(proj,b,s);
    const plan=plannedProgressAtDate(s,today);
    return {
      actual,plan,
      variance:actual-plan,
      late:!s.actualCompleteDate&&fromDateStr(s.endDate)<today&&actual<100
    };
  });
  const avgActual=stats.length?Math.round(stats.reduce((a,x)=>a+x.actual,0)/stats.length):0;
  const avgPlan=stats.length?Math.round(stats.reduce((a,x)=>a+x.plan,0)/stats.length):0;
  const variance=avgActual-avgPlan;
  const lateCount=stats.filter(x=>x.late).length;
  return {avgActual,avgPlan,variance,lateCount};
}

function dualPrintScheduleLabel(proj,b,s){
  const pr=proj.processes.find(x=>x.id===s.processId);
  const group=proj.processGroups.find(g=>g.id===pr?.groupId);
  const sub=ganttSubprocessName(proj,s.processId,s.subProcessId);
  const floorLabel=taskFloorLabel(b,s.floors)||compressFloorLabel(b,s.floors)||'未指定樓層';
  const hierarchy=[
    group?.name||'未分組',
    pr?.name||'未命名工序',
    sub||''
  ].filter(Boolean).join('／');
  return {hierarchy,floorLabel};
}

function dualPrintTrackCells(days,pageStart,pageEnd,startDate,endDate,barClass,emptyText){
  if(!startDate || !endDate){
    return `<td class="dgp-empty" colspan="${days.length}">${esc(emptyText||'尚無實際開始紀錄')}</td>`;
  }

  const sd=startDate instanceof Date?startDate:fromDateStr(startDate);
  const ed=endDate instanceof Date?endDate:fromDateStr(endDate);
  if(ed<pageStart || sd>pageEnd){
    return `<td class="dgp-day" colspan="${days.length}"></td>`;
  }

  const clipStart=sd<pageStart?pageStart:sd;
  const clipEnd=ed>pageEnd?pageEnd:ed;
  const startIdx=diffDays(pageStart,clipStart);
  const span=Math.max(1,diffDays(clipStart,clipEnd)+1);
  let cells='';

  if(startIdx>0){
    cells+=`<td class="dgp-day" colspan="${startIdx}"></td>`;
  }
  cells+=`<td class="dgp-bar-cell" colspan="${span}"><div class="dgp-bar ${barClass}"></div></td>`;
  const remain=days.length-startIdx-span;
  if(remain>0){
    cells+=`<td class="dgp-day" colspan="${remain}"></td>`;
  }
  return cells;
}

function buildDualGanttPrintHTML(proj,b){
  const schedules=[...proj.schedules]
    .filter(s=>s.buildingId===b.id)
    .sort((a,c)=>a.startDate.localeCompare(c.startDate)||a.endDate.localeCompare(c.endDate));

  if(!schedules.length) return '';

  const {start,end}=getScheduleWindow(proj);
  const allDays=dateRangeArray(start,end);
  const dayPages=[];
  for(let i=0;i<allDays.length;i+=DUAL_PRINT_DAYS_PER_PAGE){
    dayPages.push(allDays.slice(i,i+DUAL_PRINT_DAYS_PER_PAGE));
  }
  if(!dayPages.length) dayPages.push([]);

  const itemPages=[];
  for(let i=0;i<schedules.length;i+=DUAL_PRINT_ITEMS_PER_PAGE){
    itemPages.push(schedules.slice(i,i+DUAL_PRINT_ITEMS_PER_PAGE));
  }
  if(!itemPages.length) itemPages.push([]);

  const summary=dualPrintSummary(proj,b,schedules);
  const totalPages=dayPages.length*itemPages.length;
  const labelMm=47;
  const trackMm=8;
  const maxDays=Math.max(1,...dayPages.map(x=>x.length));
  const dayMm=Math.min(8.1,Math.floor(((279-labelMm-trackMm)/maxDays)*10)/10);
  const todayS=todayStr();
  const pages=[];

  dayPages.forEach((days,dayPageIndex)=>{
    const pageStart=days[0];
    const pageEnd=days[days.length-1];
    const colgroup=`<colgroup>
      <col style="width:${labelMm}mm">
      <col style="width:${trackMm}mm">
      ${days.map(()=>`<col style="width:${dayMm}mm">`).join('')}
    </colgroup>`;

    const dateHead=`<tr style="height:8mm">
      <th class="dgp-name-head">大項目／母工序／子工序・樓層</th>
      <th class="dgp-track-head">軌道</th>
      ${days.map(d=>{
        const ds=toDateStr(d);
        const weekend=d.getDay()===0||d.getDay()===6;
        const wd=['日','一','二','三','四','五','六'][d.getDay()];
        return `<th class="dgp-date-head ${weekend?'weekend':''} ${ds===todayS?'today':''}">${d.getMonth()+1}/${d.getDate()}<br>(${wd})</th>`;
      }).join('')}
    </tr>`;

    itemPages.forEach((items,itemPageIndex)=>{
      const body=items.map(s=>{
        const label=dualPrintScheduleLabel(proj,b,s);
        const actualPct=scheduleActualProgress(proj,b,s);
        const planPct=plannedProgressAtDate(s,fromDateStr(todayS));
        const variance=actualPct-planPct;
        const varianceCls=variance>3?'good':(variance<-3?'bad':'neutral');
        const varianceText=variance>0?`超前 ${variance}%`:(variance<0?`落後 ${Math.abs(variance)}%`:'符合計畫');
        const actualStart=inferredScheduleActualStart(proj,s);
        const actualEnd=s.actualCompleteDate?fromDateStr(s.actualCompleteDate):(actualStart?fromDateStr(todayS):null);
        const isLate=!s.actualCompleteDate&&fromDateStr(s.endDate)<fromDateStr(todayS)&&actualPct<100;
        const isDone=!!s.actualCompleteDate||actualPct>=100;
        const actualCls=isDone?'dgp-actual done':(isLate?'dgp-actual late':(variance>=10?'dgp-actual ahead':'dgp-actual'));

        const nameCell=`<td class="dgp-name" rowspan="2">
          <div class="dgp-main-label">${esc(label.hierarchy)}</div>
          <div class="sub">${esc(label.floorLabel)}｜預計 ${esc(s.startDate)} - ${esc(s.endDate)}</div>
          <div class="variance ${varianceCls}">計畫 ${planPct}%｜實際 ${actualPct}%｜${varianceText}</div>
        </td>`;

        const planCells=dualPrintTrackCells(
          days,pageStart,pageEnd,
          fromDateStr(s.startDate),fromDateStr(s.endDate),
          'dgp-plan',''
        );
        const actualCells=dualPrintTrackCells(
          days,pageStart,pageEnd,
          actualStart,actualEnd,
          actualCls,'尚無實際開始紀錄'
        );

        return `<tr style="height:4.7mm">${nameCell}<td class="dgp-track">預計</td>${planCells}</tr>
          <tr style="height:4.7mm"><td class="dgp-track">實際</td>${actualCells}</tr>`;
      }).join('');

      const pageNo=dayPageIndex*itemPages.length+itemPageIndex+1;
      pages.push(`<div class="dual-print-page">
        <div class="dgp-header">
          <div>
            <strong>${esc(proj.name)}｜${esc(b.name)}｜預計 vs 實際進度甘特圖</strong>
            日期範圍：${days.length?toDateStr(pageStart)+' - '+toDateStr(pageEnd):'—'}　
            列印時間：${esc(new Date().toLocaleString('zh-TW'))}
          </div>
          <div>第 ${pageNo} / ${totalPages} 頁${itemPages.length>1?`｜工項 ${itemPageIndex+1}/${itemPages.length}`:''}</div>
        </div>
        <div class="dgp-summary">
          <div class="dgp-summary-item"><span>目前計畫進度</span><b>${summary.avgPlan}%</b></div>
          <div class="dgp-summary-item ${summary.variance>=0?'good':'bad'}"><span>目前實際進度</span><b>${summary.avgActual}%</b></div>
          <div class="dgp-summary-item ${summary.variance>=0?'good':'bad'}"><span>進度差異</span><b>${summary.variance>0?'+':''}${summary.variance}%</b></div>
          <div class="dgp-summary-item ${summary.lateCount?'bad':'good'}"><span>逾期未完成</span><b>${summary.lateCount}</b></div>
        </div>
        <div class="dgp-table-wrap">
          <table class="dgp-table">
            ${colgroup}
            <thead>${dateHead}</thead>
            <tbody>${body}</tbody>
          </table>
        </div>
        <div class="dgp-legend">
          <span><i class="plan"></i>預計工期</span>
          <span><i style="background:#E97B2F"></i>實際進行中</span>
          <span><i style="background:#1E8E5A"></i>實際完成</span>
          <span><i style="background:#C6453A"></i>逾期未完成</span>
          <span><i style="background:#2E6EA6"></i>實際明顯超前</span>
          <span>實際百分比由樓層／工序矩陣自動彙整</span>
        </div>
      </div>`);
    });
  });

  return pages.join('');
}

function exportDualGanttPDF(){
  const proj=currentProject();
  const printRoot=document.getElementById('print-root');
  const targets=state.ganttMode==='all'
    ? proj.buildings
    : (currentBuilding()?[currentBuilding()]:[]);

  if(!targets.length){
    showToast('請先建立並選擇棟別','error');
    return;
  }

  const html=targets.map(b=>buildDualGanttPrintHTML(proj,b)).filter(Boolean).join('');
  if(!html){
    showToast('目前沒有可輸出的排程','error');
    return;
  }

  printRoot.innerHTML=html;
  setTimeout(()=>window.print(),80);
}


function exportGanttPDF(){
  const proj = currentProject();
  if(!proj.buildings.some(b=>buildingProcesses(proj,b).length)){ showToast('尚未設定工序','error'); return; }
  const printRoot = document.getElementById('print-root');
  if(state.ganttMode==='all'){
    if(proj.buildings.length===0){ showToast('尚未建立棟別','error'); return; }
    printRoot.innerHTML = proj.buildings.map(b=>buildGanttPrintHTML(proj, b)).join('');
  } else {
    const b = currentBuilding();
    if(!b){ showToast('請先選擇棟別','error'); return; }
    printRoot.innerHTML = buildGanttPrintHTML(proj, b);
  }
  setTimeout(()=>{ window.print(); }, 60);
}
let ganttResizeState = {active:false, scheduleId:null, startX:0, origEnd:null, origStart:null};
function ganttResizeMouseDown(e, scheduleId){
  e.preventDefault(); e.stopPropagation();
  const proj = currentProject(); const s = proj.schedules.find(x=>x.id===scheduleId); if(!s) return;
  ganttResizeState = {active:true, scheduleId, startX:e.clientX, origEnd:fromDateStr(s.endDate), origStart:fromDateStr(s.startDate)};
}
document.addEventListener('mousemove', function(e){
  if(!ganttResizeState.active) return;
  const proj = currentProject(); const s = proj.schedules.find(x=>x.id===ganttResizeState.scheduleId); if(!s) return;
  const deltaDays = Math.round((e.clientX-ganttResizeState.startX)/GT_DAY_WIDTH);
  let newEnd = addDays(ganttResizeState.origEnd, deltaDays);
  if(newEnd < ganttResizeState.origStart) newEnd = new Date(ganttResizeState.origStart);
  s.endDate = toDateStr(newEnd);
  refreshScheduleBarDOM(s);
});
document.addEventListener('mouseup', function(){ if(ganttResizeState.active){ scheduleSave(); ganttResizeState={active:false,scheduleId:null}; } });

// 檢查若把 candidateId 設為 forId 的前置任務，是否會造成循環相依
function wouldCreateCycle(proj, forId, candidateId){
  if(forId===candidateId) return true;
  const visited = new Set();
  const stack = [candidateId];
  while(stack.length){
    const cur = stack.pop();
    if(cur===forId) return true;
    if(visited.has(cur)) continue;
    visited.add(cur);
    const s = proj.schedules.find(x=>x.id===cur);
    if(s) (s.dependsOn||[]).forEach(depId=>stack.push(depId));
  }
  return false;
}
function renderScheduleForm(){

  const subOptions = ganttSubprocessesForProcess(proj, fs.processId, true).filter(sp=>sp.visible!==false || sp.id===fs.subProcessId).map(sp=>`<option value="${sp.id}" ${fs.subProcessId===sp.id?'selected':''}>${esc(sp.name)}${sp.visible===false?'（已隱藏）':''}</option>`).join('');
  // 前置任務候選：同一棟別、非自己、且選了不會造成循環相依的其他排程

  const depChips = candidates.map(s=>{

    return `<button type="button" class="chip ${fs.dependsOn.includes(s.id)?'selected':''}" ${disabled?'disabled title="選擇此項會造成循環相依"':''} onclick="toggleSchedDep('${s.id}')">${esc(scheduleLabel(proj,b,s))}</button>`;

  openModal(`

          </div>
          <div class="field">
            <label>適用樓層（可複選）</label>
            <div style="display:flex;gap:8px;margin-bottom:8px;">
              <button type="button" class="btn btn-sm" onclick="setSchedFloors('all')">全選</button>
              <button type="button" class="btn btn-sm" onclick="setSchedFloors('none')">清除</button>

function toggleSchedDep(scheduleId){

  if(fs.mode==='edit' && wouldCreateCycle(proj, fs.id, scheduleId) && !fs.dependsOn.includes(scheduleId)){

  }

function submitScheduleForm(e){
  e.preventDefault();
  const proj = currentProject(); const fs = formState.schedForm;
  if(fs.floors.length===0){ showToast('請至少選擇一個樓層','error'); return false; }
  let startDate = document.getElementById('sched-start').value;
  let endDate = document.getElementById('sched-end').value;
  const actualStartDate = document.getElementById('sched-actual-start')?.value || null;
  const actualCompleteDate = document.getElementById('sched-actual').value || null;
  const subProcessId = document.getElementById('sched-subprocess')?.value || null;
  const note = document.getElementById('sched-note').value.trim();
  if(!startDate||!endDate) return false;
  if(fromDateStr(endDate) < fromDateStr(startDate)){ const t=startDate; startDate=endDate; endDate=t; }

  // 依前置任務自動順延開始日（保留原本工期天數）
  let adjusted = false;
  if(fs.dependsOn.length){
    const durationDays = diffDays(fromDateStr(startDate), fromDateStr(endDate));
    let minAllowedStart = null;
    fs.dependsOn.forEach(depId=>{
      const dep = proj.schedules.find(x=>x.id===depId); if(!dep) return;
      const depEnd = fromDateStr(dep.actualCompleteDate || dep.endDate);
      const allowed = addDays(depEnd, 1);
      if(!minAllowedStart || allowed > minAllowedStart) minAllowedStart = allowed;
    });
    if(minAllowedStart && fromDateStr(startDate) < minAllowedStart){
      startDate = toDateStr(minAllowedStart);
      endDate = toDateStr(addDays(minAllowedStart, durationDays));
      adjusted = true;
    }
  }

  if(fs.mode==='edit'){
    const s = proj.schedules.find(x=>x.id===fs.id);
    s.floors=fs.floors; s.startDate=startDate; s.endDate=endDate; s.actualStartDate=actualStartDate; s.actualCompleteDate=actualCompleteDate; s.subProcessId=subProcessId; s.note=note; s.dependsOn=fs.dependsOn;
  }else{
    proj.schedules.push({id:uid('sc'), buildingId:fs.buildingId, processId:fs.processId, subProcessId, floors:fs.floors, startDate, endDate, actualStartDate, actualCompleteDate, note, dependsOn:fs.dependsOn});
  }
  scheduleSave(); closeModal(); render();
  showToast(adjusted ? '已儲存，並依前置任務自動順延開始日為 '+startDate : '已儲存預定排程');
  return false;
}

  proj.schedules = proj.schedules.filter(x=>x.id!==id);

/* =====================  11. 施作紀錄（搜尋／分棟／連續樓層合併）  ===================== */
function recordMatchesFilter(proj, b, pr, r, tokens, dateStr){
  if(dateStr){
    const d = new Date(r.updatedAt);
    if(toDateStr(d)!==dateStr) return false;
  }
  if(tokens.length){
    const si = statusInfo(r.status);
    const hay = [b.name, pr.name, r.floor, partNames(proj,r.partIds), r.note||'', r.crew||'', si.label].join(' ').toLowerCase();
    if(!tokens.every(t=>hay.includes(t))) return false;
  }
  return true;
}
function groupRecordsForDisplay(proj, b, tokens, dateStr){
  const idx = new Map(b.floors.map((f,i)=>[f,i]));
  const rows = [];
  buildingProcesses(proj,b).forEach(pr=>{
    const recs = proj.records.filter(r=>r.buildingId===b.id && r.processId===pr.id && recordMatchesFilter(proj,b,pr,r,tokens,dateStr));
    if(recs.length===0) return;
    const bySig = new Map();
    recs.forEach(r=>{
      const sig = r.progress+'|'+r.status+'|'+[...(r.partIds||[])].sort().join(',')+'|'+(r.note||'')+'|'+(r.crew||'')+'|'+(r.blockReason||'');
      if(!bySig.has(sig)) bySig.set(sig, []);
      bySig.get(sig).push(r);
    });
    bySig.forEach(list=>{
      list.sort((a,c)=>(idx.get(a.floor)??999)-(idx.get(c.floor)??999));
      let run=[list[0]];
      for(let i=1;i<list.length;i++){
        if(idx.get(list[i].floor)===idx.get(list[i-1].floor)+1){ run.push(list[i]); }
        else{ rows.push(makeRecordRow(pr,run)); run=[list[i]]; }
      }
      rows.push(makeRecordRow(pr,run));
    });
  });
  rows.sort((a,c)=>c.latestUpdate-a.latestUpdate);
  return rows;
}
function makeRecordRow(pr, run){
  const floors = run.map(r=>r.floor);
  const floorLabel = floors.length>1 ? `${floors[0]}–${floors[floors.length-1]}` : floors[0];
  return { process:pr, floors, floorLabel, floorCount:floors.length, firstFloor:floors[0],
    progress:run[0].progress, status:run[0].status, partIds:run[0].partIds, note:run[0].note, crew:run[0].crew, blockReason:run[0].blockReason||'',
    latestUpdate: Math.max(...run.map(r=>r.updatedAt)) };
}
function renderRecordsPage(proj){
  return `
    <div class="page-intro"><div><h2>施作日誌／紀錄</h2><p>每次現場回報都會成為可搜尋的施工日誌，照片也會同步出現在工程照片中心。</p></div><div class="page-intro-actions"><button class="btn" onclick="setView('photos')">${ICO.camera} 工程照片</button><button class="btn btn-primary" onclick="openQuickAddModal()">${ICO.plus} 新增回報</button></div></div>
    <div class="field-row" style="align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;">
      <div class="field" style="min-width:220px;flex:2;">
        <label>關鍵字（可輸入多個詞，如「AB棟 16F 矽膠」）</label>
        <input type="text" id="rec-search-kw" placeholder="輸入關鍵字搜尋" oninput="filterRecordsUpdate()">
      </div>
      <div class="field" style="max-width:170px;"><label>日期</label><input type="date" id="rec-search-date" oninput="filterRecordsUpdate()"></div>
      <div class="field" style="max-width:90px;"><button type="button" class="btn btn-block" onclick="clearRecordsFilter()">清除</button></div>
    </div>
    <div id="records-list-container">${renderRecordsList(proj)}</div>`;
}
function renderRecordsList(proj){
  const kwRaw = (document.getElementById('rec-search-kw')?.value || '').trim().toLowerCase();
  const tokens = kwRaw ? kwRaw.split(/\s+/).filter(Boolean) : [];
  const dateStr = document.getElementById('rec-search-date')?.value || '';
  const sections = proj.buildings.map(b=>{
    const rows = groupRecordsForDisplay(proj, b, tokens, dateStr);
    if(rows.length===0) return '';
    const rowsHtml = rows.map(row=>{
      const si = statusInfo(row.status);
      return `<div class="task-row" onclick="openCellModal('${b.id}','${esc(row.firstFloor)}','${row.process.id}')">
        <div class="t-main">
          <div class="t-title">${esc(row.floorLabel)}　・　${esc(row.process.name)}</div>
          <div class="t-sub">${esc(partNames(proj,row.partIds))}${row.floorCount>1?` ・ 共 ${row.floorCount} 層`:''} ・ ${fmtTime(row.latestUpdate)}${row.crew?' ・ '+esc(row.crew):''}${row.blockReason?` ・ <span style="color:var(--red-dk,#a12a21);font-weight:700;">⚠ ${esc(row.blockReason)}</span>`:''}${row.note?' ・ '+esc(row.note):''}</div>
        </div>
        <span class="badge" style="background:${si.bg};color:${si.fg};"><span class="dot" style="background:${si.dot};"></span>${row.progress}%</span>
      </div>`;
    }).join('');
    return `<div class="home-card" style="margin-bottom:14px;"><h4>${esc(b.name)}</h4>${rowsHtml}</div>`;
  }).join('');
  return sections || `<div class="empty-state"><h3>查無符合的施作紀錄</h3><p>請調整關鍵字或日期後再試一次。</p></div>`;
}

function deleteProcess(id){
  const proj=settingsProject(),b=settingsBuilding(),pr=processById(proj,id);if(!pr||!b)return;
  const affected=proj.records.filter(r=>r.buildingId===b.id&&r.processId===id).length;
  const sched=proj.schedules.filter(s=>s.buildingId===b.id&&s.processId===id).length;

  b.processIds=b.processIds.filter(x=>x!==id);proj.processes=proj.processes.filter(x=>x.id!==id);

  proj.schedules=proj.schedules.filter(s=>!(s.buildingId===b.id&&s.processId===id));
  proj.schedules.forEach(s=>s.dependsOn=(s.dependsOn||[]).filter(x=>!removed.has(x)));

function fileToResizedDataURL(file, maxW, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject; img.src = reader.result;
    };
    reader.onerror = reject; reader.readAsDataURL(file);
  });
}
async function handleRecordPhoto(e){
  const file = e.target.files[0]; if(!file) return;
  try{ const dataUrl = await fileToResizedDataURL(file, 480, 0.6); formState.recForm.photo = dataUrl;
    document.getElementById('rec-photo-preview').innerHTML = `<img class="photo-preview" src="${dataUrl}">`;
  }catch(err){ showToast('照片處理失敗','error'); }
}
function submitRecord(e){
  e.preventDefault();
  const proj = currentProject(); const fs = formState.recForm;
  const crew = document.getElementById('rec-crew').value.trim();
  const note = document.getElementById('rec-note').value.trim();
  const blockReason = document.getElementById('rec-block').value;

  let progress = Number(document.getElementById('rec-progress').value||0);
  let status = fs.status;
  let partIds = [...fs.partIds];
  let autoByParts = !!fs.autoByParts;
  let autoOverallProgress = null;

  if(autoByParts){
    const stats = matrixAutoSelectionStats(proj, partIds);
    partIds = stats.selected;
    autoOverallProgress = stats.percent;

    // 每個被選取的部位視為該部位已完成，因此記錄值為 100；
    // 矩陣顯示則以「完成部位數 ÷ 總部位數」自動換算。
    progress = stats.done ? 100 : 0;

    const blockingStatuses = ['waiting_material','waiting_quote','waiting_contract','waiting_cutting','pending_confirm','blocked_predecessor','delayed'];
    if(!blockingStatuses.includes(status)){
      if(stats.total && stats.done>=stats.total) status='done';
      else if(stats.done>0) status='in_progress';
      else status='not_started';
    }
  }

  const payload = {
    partIds, progress, status, note, crew, photo:fs.photo, blockReason,
    autoByParts, autoOverallProgress, updatedAt:Date.now()
  };

  if(fs.recordId){
    const r = proj.records.find(x=>x.id===fs.recordId);
    Object.assign(r,payload);
  }else{
    proj.records.push({
      id:uid('r'), buildingId:fs.buildingId, floor:fs.floor,
      processId:fs.processId, ...payload
    });
  }

  scheduleSave();
  formState.cell = {buildingId:fs.buildingId, floor:fs.floor, processId:fs.processId};
  renderCellModal(); render();
  showToast(autoByParts?`已儲存，矩陣自動完成度為 ${autoOverallProgress}%`:'已儲存進度記錄');
  return false;
}

/* =====================  13. 快速新增進度（現場主要操作流程）  ===================== */
function openQuickAddModal(presetBuildingId){
  const proj = currentProject();
  const b = presetBuildingId ? proj.buildings.find(x=>x.id===presetBuildingId) : currentBuilding();
  formState.quickAdd = {
    projectId: proj.id, buildingId: b?b.id:(proj.buildings[0]?proj.buildings[0].id:null),
    floors: [], partIds: [], processId: buildingProcesses(proj,b)[0]?buildingProcesses(proj,b)[0].id:null,
    progress: 50, status: 'in_progress', note: '', crew: '', photo: null, blockReason: ''
  };
  renderQuickAddForm();
}
/* ---------- 常用模板：儲存案場/棟別/部位/工序/狀態/工班/備註，套用時只需改樓層與比例 ---------- */
function saveQuickTemplate(){
  const fs = formState.quickAdd;
  // 先把表單目前輸入值同步回 fs（select/input 不會自動回寫）
  syncQuickFormToState();
  const name = prompt('模板名稱（例：AB棟南側矽膠收縫）');
  if(name===null) return;
  const trimmed = name.trim(); if(!trimmed){ showToast('請輸入模板名稱','error'); return; }
  if(state.quickTemplates.length>=20){ showToast('模板數量已達上限（20組），請先刪除不用的模板','error'); return; }
  state.quickTemplates.push({ id:uid('tp'), name:trimmed,
    projectId:fs.projectId, buildingId:fs.buildingId, partIds:[...fs.partIds], processId:fs.processId,
    status:fs.status, crew:fs.crew, note:fs.note, blockReason:fs.blockReason });
  scheduleSave(); renderQuickAddForm();
  showToast('已儲存模板「'+trimmed+'」');
}
function applyQuickTemplate(id){
  const tp = state.quickTemplates.find(t=>t.id===id); if(!tp) return;
  const proj = state.projects.find(p=>p.id===tp.projectId);
  if(!proj){ showToast('此模板的案場已不存在','error'); return; }
  const fs = formState.quickAdd;
  fs.projectId = tp.projectId;
  fs.buildingId = proj.buildings.find(x=>x.id===tp.buildingId) ? tp.buildingId : (proj.buildings[0]?proj.buildings[0].id:null);
  fs.partIds = tp.partIds.filter(pid=>buildingParts(proj,b).some(pt=>pt.id===pid));
  fs.processId = buildingProcesses(proj,b).some(pr=>pr.id===tp.processId) ? tp.processId : (buildingProcesses(proj,b)[0]?.id||null);
  fs.status = tp.status; fs.crew = tp.crew||''; fs.note = tp.note||''; fs.blockReason = tp.blockReason||'';
  fs.floors = []; // 樓層與比例由使用者自行設定
  renderQuickAddForm();
  showToast('已套用模板，請選擇樓層與完成比例');
}
function deleteQuickTemplate(id){
  const tp = state.quickTemplates.find(t=>t.id===id); if(!tp) return;
  if(!confirm(`刪除模板「${tp.name}」？`)) return;
  state.quickTemplates = state.quickTemplates.filter(t=>t.id!==id);
  scheduleSave(); renderQuickAddForm();
}
function syncQuickFormToState(){
  const fs = formState.quickAdd;
  const pEl=document.getElementById('qa-process'), gEl=document.getElementById('qa-progress'),
        cEl=document.getElementById('qa-crew'), nEl=document.getElementById('qa-note'), bEl=document.getElementById('qa-block');
  if(pEl) fs.processId = pEl.value;
  if(gEl) fs.progress = Number(gEl.value);
  if(cEl) fs.crew = cEl.value.trim();
  if(nEl) fs.note = nEl.value.trim();
  if(bEl) fs.blockReason = bEl.value;
}
function renderQuickAddForm(){
  const fs = formState.quickAdd;
  const proj = state.projects.find(p=>p.id===fs.projectId);
  const projectOpts = state.projects.map(p=>`<option value="${p.id}" ${p.id===fs.projectId?'selected':''}>${esc(p.name)}</option>`).join('');
  if(!proj.buildings.length){
    openModal(`<div class="modal"><div class="modal-head"><h3>快速新增進度</h3><button class="icon-btn" onclick="closeModal()">${ICO.close}</button></div>
      <div class="modal-body"><div class="empty-state"><h3>此案場尚無棟別</h3><p>請先新增棟別後再登錄進度。</p>
      <button class="btn btn-primary" onclick="closeModal();openAddBuildingModal();">${ICO.plus} 新增棟別</button></div></div></div>`);
    return;
  }
  const b = proj.buildings.find(x=>x.id===fs.buildingId) || proj.buildings[0];
  fs.buildingId = b.id;
  const buildingOpts = proj.buildings.map(x=>`<option value="${x.id}" ${x.id===fs.buildingId?'selected':''}>${esc(x.name)}</option>`).join('');
  const processOpts = buildingProcesses(proj,b).map(x=>`<option value="${x.id}" ${x.id===fs.processId?'selected':''}>${esc(x.name)}</option>`).join('');
  const floorChips = b.floors.map(fl=>`<button type="button" class="chip chip-floor ${fs.floors.includes(fl)?'selected':''}" onclick="toggleQuickFloor('${esc(fl)}')">${esc(fl)}</button>`).join('');
  const floorOpts = b.floors.map(fl=>`<option value="${esc(fl)}">${esc(fl)}</option>`).join('');
  const partChips = buildingParts(proj,b).map(pt=>`<button type="button" class="chip ${fs.partIds.includes(pt.id)?'selected':''}" onclick="toggleQuickPart('${pt.id}')">${esc(pt.name)}</button>`).join('');
  const statusBtns = STATUS_ORDER.map(k=>{ const s=STATUS[k]; return `<button type="button" class="status-btn ${fs.status===k?'selected':''}" style="color:${s.fg};" onclick="setQuickStatus('${k}')"><span class="dot" style="background:${s.dot};width:8px;height:8px;border-radius:50%;display:inline-block;"></span>${s.label}</button>`; }).join('');

  openModal(`
    <div class="modal modal-wide">
      <div class="modal-head"><h3>快速新增進度</h3><button class="icon-btn" onclick="closeModal()">${ICO.close}</button></div>
      <form onsubmit="return submitQuickAdd(event)">
        <div class="modal-body">
          <div class="field" style="margin-bottom:10px;">
            <label>常用模板（點擊套用，只需再選樓層與比例）</label>
            <div class="chip-group">
              ${state.quickTemplates.map(tp=>`<span class="chip tpl-chip" onclick="applyQuickTemplate('${tp.id}')">${esc(tp.name)}<button type="button" class="tpl-del" onclick="event.stopPropagation();deleteQuickTemplate('${tp.id}')" title="刪除模板">×</button></span>`).join('')}
              <button type="button" class="chip" style="border-style:dashed;" onclick="saveQuickTemplate()">${ICO.plus} 儲存目前選擇為模板</button>
            </div>
          </div>
          <button type="button" class="btn btn-sm" style="margin-bottom:14px;" onclick="copyLastEntry()">${ICO.copy} 複製上一筆進度</button>
          <div class="field-row">
            <div class="field"><label>① 案場</label><select id="qa-project" onchange="changeQuickProject(this.value)">${projectOpts}</select></div>
            <div class="field"><label>② 棟別</label><select id="qa-building" onchange="changeQuickBuilding(this.value)">${buildingOpts}</select></div>
          </div>
          <div class="field">
            <label>③ 樓層（可複選，或用範圍快速選取）</label>
            <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:center;">
              <select id="qa-floor-from" style="width:auto;">${floorOpts}</select>
              <span style="color:var(--ink-faint);">到</span>
              <select id="qa-floor-to" style="width:auto;">${floorOpts}</select>
              <button type="button" class="btn btn-sm" onclick="applyQuickFloorRange()">套用範圍</button>
              <button type="button" class="btn btn-sm" onclick="setQuickFloors('all')">全選</button>
              <button type="button" class="btn btn-sm" onclick="setQuickFloors('none')">清除</button>
            </div>
            <div class="floor-select-grid">${floorChips}</div>
          </div>
          <div class="field"><label>④ 部位（可複選，不選代表全區域）</label><div class="chip-group">${partChips}</div></div>
          <div class="field"><label>⑤ 工序</label><select id="qa-process">${processOpts}</select></div>
          <div class="field"><label>⑥ 完成比例</label>
            <div class="range-wrap">
              <input type="range" min="0" max="100" step="5" id="qa-progress" value="${fs.progress}" oninput="document.getElementById('qa-progress-val').textContent=this.value+'%'">
              <span class="range-val" id="qa-progress-val">${fs.progress}%</span>
            </div>
          </div>
          <div class="field"><label>工程狀態</label><div class="status-btn-group">${statusBtns}</div></div>
          <div class="field-row">
            <div class="field"><label>負責工班（選填）</label><input type="text" id="qa-crew" value="${esc(fs.crew)}" placeholder="例：昌盛防水班" list="qa-crew-suggest"></div>
            <div class="field"><label>卡點原因（選填）</label><select id="qa-block"><option value="">無卡點</option>${BLOCK_REASONS.map(r=>`<option value="${esc(r)}" ${fs.blockReason===r?'selected':''}>${esc(r)}</option>`).join('')}</select></div>
          </div>
          <datalist id="qa-crew-suggest">${[...new Set(proj.records.map(r=>r.crew).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
          <div class="field"><label>⑦ 備註（選填）</label><textarea id="qa-note" rows="2" placeholder="例：逐步往下施作中">${esc(fs.note)}</textarea></div>
          <div class="field"><label>照片（選填）</label><input type="file" accept="image/*" capture="environment" onchange="handleQuickPhoto(event)"><div id="qa-photo-preview">${fs.photo?`<img class="photo-preview" src="${fs.photo}">`:''}</div></div>
          <div class="hint">套用至已選樓層：相同棟別＋樓層＋工序＋部位組合會覆蓋原有進度，其餘會新增。</div>
        </div>
        <div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">取消</button><button type="submit" class="btn btn-primary btn-lg">儲存進度</button></div>
      </form>
    </div>`);
}
function changeQuickProject(id){ formState.quickAdd.projectId=id; formState.quickAdd.buildingId=null; formState.quickAdd.floors=[]; renderQuickAddForm(); }
function changeQuickBuilding(id){ syncQuickFormToState(); formState.quickAdd.buildingId=id; formState.quickAdd.floors=[]; renderQuickAddForm(); }
function toggleQuickFloor(fl){ syncQuickFormToState(); const fs=formState.quickAdd; const i=fs.floors.indexOf(fl); if(i>=0) fs.floors.splice(i,1); else fs.floors.push(fl); renderQuickAddForm(); }
function toggleQuickPart(id){ syncQuickFormToState(); const fs=formState.quickAdd; const i=fs.partIds.indexOf(id); if(i>=0) fs.partIds.splice(i,1); else fs.partIds.push(id); renderQuickAddForm(); }
function setQuickStatus(key){ syncQuickFormToState(); formState.quickAdd.status=key; if(key==='done') formState.quickAdd.progress=100; renderQuickAddForm(); }
function setQuickFloors(mode){
  syncQuickFormToState();
  const proj = state.projects.find(p=>p.id===formState.quickAdd.projectId);
  const b = proj.buildings.find(x=>x.id===formState.quickAdd.buildingId);
  formState.quickAdd.floors = mode==='all' ? [...b.floors] : [];
  renderQuickAddForm();
}
function applyQuickFloorRange(){
  syncQuickFormToState();
  const proj = state.projects.find(p=>p.id===formState.quickAdd.projectId);
  const b = proj.buildings.find(x=>x.id===formState.quickAdd.buildingId);
  const from = document.getElementById('qa-floor-from').value, to = document.getElementById('qa-floor-to').value;
  const i1 = b.floors.indexOf(from), i2 = b.floors.indexOf(to);
  if(i1<0||i2<0) return;
  const lo = Math.min(i1,i2), hi = Math.max(i1,i2);
  const range = b.floors.slice(lo, hi+1);
  const set = new Set([...formState.quickAdd.floors, ...range]);
  formState.quickAdd.floors = [...set];
  renderQuickAddForm();
}
async function handleQuickPhoto(e){
  const file = e.target.files[0]; if(!file) return;
  try{ const dataUrl = await fileToResizedDataURL(file, 480, 0.6); formState.quickAdd.photo = dataUrl;
    document.getElementById('qa-photo-preview').innerHTML = `<img class="photo-preview" src="${dataUrl}">`;
  }catch(err){ showToast('照片處理失敗','error'); }
}
function copyLastEntry(){
  const proj = state.projects.find(p=>p.id===formState.quickAdd.projectId);
  const last = [...proj.records].sort((a,c)=>c.updatedAt-a.updatedAt)[0];
  if(!last){ showToast('此案場尚無歷史紀錄可複製','error'); return; }
  const fs = formState.quickAdd;
  fs.buildingId = last.buildingId; fs.floors = [last.floor]; fs.partIds = [...(last.partIds||[])];
  fs.processId = last.processId; fs.progress = last.progress; fs.status = last.status;
  fs.note = last.note||''; fs.crew = last.crew||''; fs.photo = last.photo||null; fs.blockReason = last.blockReason||'';
  renderQuickAddForm();
  showToast('已複製上一筆進度，請確認後儲存');
}
function submitQuickAdd(e){
  e.preventDefault();
  const fs = formState.quickAdd;
  const proj = state.projects.find(p=>p.id===fs.projectId);
  const processId = document.getElementById('qa-process').value;
  const progress = Number(document.getElementById('qa-progress').value);
  const crew = document.getElementById('qa-crew').value.trim();
  const note = document.getElementById('qa-note').value.trim();
  const blockReason = document.getElementById('qa-block').value;
  if(fs.floors.length===0){ showToast('請至少選擇一個樓層','error'); return false; }
  const partKey = [...fs.partIds].sort().join(',');
  const now = Date.now();
  fs.floors.forEach(floor=>{
    const match = proj.records.find(r=>r.buildingId===fs.buildingId && r.floor===floor && r.processId===processId && [...(r.partIds||[])].sort().join(',')===partKey);
    if(match){ match.progress=progress; match.status=fs.status; match.note=note; match.crew=crew; match.blockReason=blockReason; if(fs.photo) match.photo=fs.photo; match.updatedAt=now; }
    else{ proj.records.push({id:uid('r'), buildingId:fs.buildingId, floor, processId, partIds:[...fs.partIds], progress, status:fs.status, note, crew, photo:fs.photo, blockReason, updatedAt:now}); }
  });
  state.activeProjectId = fs.projectId; state.activeBuildingId = fs.buildingId;
  if(state.view==='home') state.view='buildings';
  scheduleSave(); closeModal(); render();
  showToast(`已套用至 ${fs.floors.length} 個樓層`);
  return false;
}

/* =====================  14. 啟動  ===================== */
loadState().catch(err=>{
  console.error('APP 啟動失敗', err);
  const app = document.getElementById('app');
  if(app){
    app.innerHTML = `
      <div style="padding:32px;max-width:720px;margin:40px auto;background:#fff;border:1px solid #DDE3EA;border-radius:12px;font-family:'Noto Sans TC',sans-serif;line-height:1.7;color:#0F2233;">
        <h2 style="margin:0 0 12px;color:#0F2A43;">APP 啟動失敗</h2>
        <p>Chrome 已載入檔案，但 JavaScript 啟動時發生錯誤。請先嘗試重新整理，或改用「本機安全版」檔案。</p>
        <pre style="white-space:pre-wrap;background:#F3F5F8;padding:12px;border-radius:8px;color:#C4392F;">${esc(err && (err.message || err.stack) || err)}</pre>
      </div>`;
  }
});
</script>
